name: Agent background extraction

on:
  push:
    branches: [agent/security-hardening-0-7]
    paths:
      - scripts/_agent_background_extract.py
      - .github/workflows/_agent_background_extract.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/security-hardening-0-7
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python scripts/_agent_background_extract.py
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app scripts
      - name: Commit tested extraction
        run: |
          git config user.name "chandler-sol"
          git config user.email "64607629+chandler-sol@users.noreply.github.com"
          git add app/main.py
          git diff --cached --quiet && exit 0
          git commit -m "Extract background coordination from main"
          git push origin HEAD:agent/security-hardening-0-7
