name: Agent CodeRabbit Round 2

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref_name == 'agent/security-hardening-0-7' && github.event.head_commit.message != 'Resolve aggregate lockout follow-up'
    runs-on: ubuntu-latest
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Apply reviewed fixes
        run: python scripts/_agent_coderabbit_round2.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full tests
        run: python -m unittest discover -s tests -v

      - name: Compile application
        run: python -m compileall -q app scripts

      - name: Push tested non-workflow changes
        run: |
          rm scripts/_agent_coderabbit_round2.py
          git config user.name "arsenik"
          git config user.email "64607629+chandler-sol@users.noreply.github.com"
          git add -A
          git reset .github/workflows/_agent_coderabbit_round2.yml
          git commit -m "Resolve aggregate lockout follow-up"
          git push origin HEAD:${{ github.ref_name }}
