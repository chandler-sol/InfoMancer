name: Agent final hardening batch

on:
  push:
    branches:
      - agent/security-hardening-0-7
    paths:
      - scripts/_agent_final_batch.py
      - .github/workflows/_agent_final_batch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/security-hardening-0-7
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Apply final batch
        run: python scripts/_agent_final_batch.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile application
        run: python -m compileall -q app scripts

      - name: Commit tested changes
        run: |
          git config user.name "chandler-sol"
          git config user.email "64607629+chandler-sol@users.noreply.github.com"
          git add -A
          git reset scripts/_agent_final_batch.py .github/workflows/_agent_final_batch.yml
          git diff --cached --quiet && exit 0
          git commit -m "Complete architecture and security hardening"
          git push origin HEAD:agent/security-hardening-0-7
