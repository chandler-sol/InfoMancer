name: Agent Fix Rename Error Contract

on:
  push:
    branches:
      - audit/0.9-cycle-0d
    paths:
      - .github/workflows/_agent_fix_rename_error_contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: audit/0.9-cycle-0d
          persist-credentials: true
          fetch-depth: 0
      - name: Apply exact repair
        run: python scripts/_agent_fix_rename_error_contract.py
      - name: Verify exact changed paths
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'app/rename_proposals.py\ntests/test_rename_proposals.py'
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/rename_proposals.py tests/test_rename_proposals.py
          git commit -m "Normalize rename rollback failure handling"
          git push origin HEAD:audit/0.9-cycle-0d
