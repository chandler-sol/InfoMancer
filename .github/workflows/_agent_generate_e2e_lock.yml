name: Generate E2E Lockfile

on:
  push:
    branches:
      - audit/0.9-cycle-0d
    paths:
      - .github/workflows/_agent_generate_e2e_lock.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/0.9-cycle-0d
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Generate npm lockfile without running dependency scripts
        working-directory: e2e
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit only the generated E2E lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(git status --short)"
          echo "$status"
          if [ "$status" != '?? e2e/package-lock.json' ] && [ "$status" != ' M e2e/package-lock.json' ]; then
            echo 'Unexpected files changed while generating the E2E lockfile; refusing commit.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/package-lock.json
          git commit -m 'Lock E2E npm dependencies'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:audit/0.9-cycle-0d
