name: Resolve container digests

on:
  push:
    branches: [agent/security-hardening-0-7]
    paths:
      - .github/workflows/_agent_image_digest.yml
      - scripts/_image_digest_trigger

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect pinned upstream images
        run: |
          docker buildx imagetools inspect python:3.13.14-slim-bookworm | sed -n '1,8p'
          docker buildx imagetools inspect cloudflare/cloudflared:2026.7.3 | sed -n '1,8p'
