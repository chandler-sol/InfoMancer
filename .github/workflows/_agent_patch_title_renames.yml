name: Agent Patch Title Renames

on:
  push:
    branches:
      - audit/0.9-cycle-0d
    paths:
      - .github/workflows/_agent_patch_title_renames.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: audit/0.9-cycle-0d
          persist-credentials: true
          fetch-depth: 0

      - name: Apply exact title-route patch
        run: python scripts/_agent_patch_title_renames.py

      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed="$(git diff --name-only)"
          expected=$'app/routes/titles.py\ntests/test_safe_file_rename.py'
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected changed files:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          git add app/routes/titles.py tests/test_safe_file_rename.py
          git commit -m "Harden live title filesystem renames"
          git push origin HEAD:audit/0.9-cycle-0d
