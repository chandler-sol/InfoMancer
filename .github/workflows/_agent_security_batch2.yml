name: Agent security batch 2

on:
  push:
    branches:
      - agent/security-hardening-0-7
    paths:
      - scripts/_agent_security_batch2.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-hardening-0-7
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply security batch
        run: python scripts/_agent_security_batch2.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile application
        run: python -m compileall -q app

      - name: Commit hardened changes
        run: |
          git config user.name "chandler-sol"
          git config user.email "64607629+chandler-sol@users.noreply.github.com"
          git add -A
          git reset scripts/_agent_security_batch2.py .github/workflows/_agent_security_batch2.yml
          git diff --cached --quiet && exit 0
          git commit -m "Apply security hardening batch 2"
          git push origin HEAD:agent/security-hardening-0-7
