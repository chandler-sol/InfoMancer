name: Agent Workspace Foundation

on:
  push:
    branches:
      - workspace/0.8-foundation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: workspace/0.8-foundation
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Apply workspace foundation
        run: python scripts/_agent_workspace_foundation.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full tests
        run: python -m unittest discover -s tests -v
      - name: Compile application
        run: python -m compileall -q app scripts
      - name: Commit tested workspace foundation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm scripts/_agent_workspace_foundation.py
          rm .github/workflows/_agent_workspace_foundation.yml
          git config user.name "arsenik"
          git config user.email "64607629+chandler-sol@users.noreply.github.com"
          git add -A
          git commit -m "Start InfoMancer 0.8 workspace foundation"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:workspace/0.8-foundation
