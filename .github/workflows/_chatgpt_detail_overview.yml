name: ChatGPT Detail Overview Validation

on:
  push:
    branches:
      - testing/0.8-alpha

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.event.head_commit.message != 'Improve title hero overview and metadata backfill'
    runs-on: ubuntu-latest
    steps:
      - name: Check out testing branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: testing/0.8-alpha
          fetch-depth: 0
          persist-credentials: false

      - name: Apply title hero patch
        run: python scripts/_chatgpt_detail_overview.py

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check whitespace
        run: git diff --check

      - name: Run full tests
        run: python -m unittest discover -s tests -v

      - name: Compile application
        run: python -m compileall -q app

      - name: Commit validated change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm scripts/_chatgpt_detail_overview.py
          rm .github/workflows/_chatgpt_detail_overview.yml
          git config user.name "chatgpt-integration"
          git config user.email "64607629+chandler-sol@users.noreply.github.com"
          git add -A
          git commit -m "Improve title hero overview and metadata backfill"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:testing/0.8-alpha
