name: ChatGPT Recovery Package Validation

on:
  push:
    branches:
      - feature/0.8-recovery-package

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/0.8-recovery-package
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply recovery package changes
        run: python scripts/_chatgpt_recovery_package.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check patch whitespace
        run: git diff --check

      - name: Run full tests
        run: python -m unittest discover -s tests -v

      - name: Compile application
        run: python -m compileall -q app

      - name: Commit validated feature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm scripts/_chatgpt_recovery_package.py
          rm .github/workflows/_chatgpt_recovery_package.yml
          git config user.name "chatgpt-integration"
          git config user.email "64607629+chandler-sol@users.noreply.github.com"
          git add -A
          git commit -m "Add portable recovery package"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feature/0.8-recovery-package
