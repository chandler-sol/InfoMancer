name: ChatGPT Recovery Package Validation

on:
  push:
    branches:
      - feature/0.8-recovery-package

permissions:
  contents: read

jobs:
  recovery-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/0.8-recovery-package
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Apply recovery package changes
        run: python scripts/_chatgpt_recovery_package.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run recovery tests
        shell: bash
        run: |
          if ! python -m unittest discover -s tests -p 'test_recovery_package.py' -v > /tmp/recovery-tests.log 2>&1; then
            tail -n 70 /tmp/recovery-tests.log
            exit 1
          fi
          cat /tmp/recovery-tests.log
