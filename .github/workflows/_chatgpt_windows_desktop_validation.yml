name: ChatGPT Windows Desktop Validation

on:
  push:
    branches:
      - feature/0.8-windows-desktop-updater

permissions:
  contents: write

jobs:
  build-test-and-commit:
    runs-on: windows-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/0.8-windows-desktop-updater
          fetch-depth: 0
          persist-credentials: false

      - name: Import desktop proof-of-concept tree
        shell: pwsh
        run: |
          git fetch origin poc/desktop-shell-w2
          git checkout origin/poc/desktop-shell-w2 -- desktop

      - name: Apply Windows desktop production changes
        run: |
          python scripts/_chatgpt_windows_desktop.py
          python scripts/_chatgpt_windows_desktop_fix1.py

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.21.0

      - name: Check patch whitespace
        run: git diff --check

      - name: Run full tests
        run: python -m unittest discover -s tests -v

      - name: Compile application
        run: python -m compileall -q app

      - name: Build bundled InfoMancer core
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name infomancer-core --add-data "app/templates;app/templates" --add-data "app/static;app/static" desktop/sidecar.py
          $triple = (rustc --print host-tuple).Trim()
          New-Item -ItemType Directory -Force desktop/src-tauri/binaries | Out-Null
          Copy-Item dist/infomancer-core.exe "desktop/src-tauri/binaries/infomancer-core-$triple.exe"
          Write-Host "Tauri sidecar target: $triple"

      - name: Smoke-test compiled recovery helper
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'infomancer-recovery-smoke'
          $backup = Join-Path $env:RUNNER_TEMP 'InfoMancer-Recovery-Smoke.infomancer-backup'
          New-Item -ItemType Directory -Force $data | Out-Null
          $env:SMOKE_DB = Join-Path $data 'infomancer.db'
          python -c "import os; from pathlib import Path; from app.db import Database; Database(Path(os.environ['SMOKE_DB'])).initialize()"
          & .\dist\infomancer-core.exe --data-dir $data --recovery-output $backup
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $backup)) { throw 'Recovery helper smoke test failed.' }

      - name: Install desktop dependencies and generate lockfile
        working-directory: desktop
        run: npm install

      - name: Generate native icon set
        working-directory: desktop
        run: npm run icon

      - name: Check Rust shell and generate lockfile
        working-directory: desktop
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS installer
        working-directory: desktop
        run: npm run build

      - name: Smoke-test zero-residue silent uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'desktop/src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent install failed: $($process.ExitCode)" }
          $installDir = Join-Path $env:LOCALAPPDATA 'InfoMancer'
          $uninstaller = Join-Path $installDir 'uninstall.exe'
          if (-not (Test-Path $uninstaller)) { throw "Installed uninstaller was not found at $uninstaller" }
          $owned = @(
            (Join-Path $env:APPDATA 'cloud.arsenik.infomancer'),
            (Join-Path $env:LOCALAPPDATA 'cloud.arsenik.infomancer'),
            (Join-Path $env:APPDATA 'cloud.arsenik.infomancer.desktop.poc'),
            (Join-Path $env:LOCALAPPDATA 'cloud.arsenik.infomancer.desktop.poc'),
            (Join-Path $env:TEMP 'InfoMancer')
          )
          foreach ($path in $owned) {
            New-Item -ItemType Directory -Force $path | Out-Null
            Set-Content (Join-Path $path 'residue-marker.txt') 'owned by InfoMancer'
          }
          $process = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent uninstall failed: $($process.ExitCode)" }
          Start-Sleep -Seconds 2
          foreach ($path in $owned) {
            if (Test-Path $path) { throw "Uninstall residue remains: $path" }
          }
          if (Test-Path 'HKCU:\Software\Arsenik\InfoMancer') { throw 'InfoMancer publisher registry state remains.' }

      - name: Upload validated preview installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: InfoMancer-Windows-0.8-alpha-preview
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          compression-level: 0

      - name: Commit validated Windows desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Remove-Item scripts/_chatgpt_windows_desktop.py
          Remove-Item scripts/_chatgpt_windows_desktop_fix1.py
          Remove-Item .github/workflows/_chatgpt_windows_desktop_validation.yml
          git config user.name "chatgpt-integration"
          git config user.email "64607629+chandler-sol@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild Windows desktop with clean uninstall and signed updater"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feature/0.8-windows-desktop-updater
