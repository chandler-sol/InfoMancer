name: Detail interaction polish final

on:
  push:
    branches: ["testing/0.8-alpha"]
    paths:
      - ".github/workflows/_detail_interaction_polish_v3.yml"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: testing/0.8-alpha
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply patch
        run: python scripts/_detail_polish_patch.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run targeted tests
        run: python -m unittest tests.test_detail_interaction_polish tests.test_detail_overview tests.test_movie_credits -v

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

      - name: Compile application
        run: python -m compileall -q app

      - name: Commit validated polish
        shell: bash
        run: |
          git config user.name "arsenik"
          git config user.email "64607629+chandler-sol@users.noreply.github.com"
          git add app/templates/detail.html app/static/workspace.js app/static/workspace-ui.css tests/test_detail_interaction_polish.py
          git rm scripts/_detail_polish_patch.py .github/workflows/_detail_interaction_polish.yml .github/workflows/_detail_interaction_polish_v2.yml .github/workflows/_detail_interaction_polish_v3.yml
          git commit -m "Polish title detail interactions"
          git push origin HEAD:testing/0.8-alpha
