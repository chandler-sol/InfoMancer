name: Apply security hardening patch

on:
  push:
    branches:
      - agent/security-hardening-0-7
    paths:
      - scripts/_agent_hardening_patch.py
      - .github/workflows/agent-hardening-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-hardening-0-7
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/_agent_hardening_patch.py

      - name: Remove temporary patch machinery
        run: |
          rm scripts/_agent_hardening_patch.py
          rm .github/workflows/agent-hardening-apply.yml

      - name: Commit hardened files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden setup, uploads, container, and proxy trust"
          git push origin HEAD:agent/security-hardening-0-7
