name: Apply Beta 2 Second Pass V4

on:
  push:
    branches:
      - release/0.8.1-beta.2
    paths:
      - .github/workflows/apply-beta2-second-pass-v4.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out Beta 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/0.8.1-beta.2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Correct helper indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/beta2_second_pass_apply_v3.py')
          text = path.read_text(encoding='utf-8')
          old = 'replacement = "\\n".join(("  " + line) if line else line for line in replacement.splitlines()) + "\\n\\n"'
          new = 'replacement = "\\n".join(("      " + line) if line else line for line in replacement.splitlines()) + "\\n\\n"'
          if old not in text:
              raise SystemExit('Expected release-workflow indentation shim was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply corrected second-pass patch
        run: python scripts/beta2_second_pass_apply_v3.py

      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check app/static/settings-tvdb-credentials.js
          node --check app/static/settings-polish.js
          node --check app/static/workspace-ui.js
          node --check app/static/app-navigation.js

      - name: Install workflow validator
        run: python -m pip install PyYAML==6.0.2

      - name: Validate canonical release workflow syntax
        shell: bash
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          workflow = yaml.safe_load(Path('.github/workflows/draft-08-release.yml').read_text(encoding='utf-8'))
          if not isinstance(workflow, dict) or 'jobs' not in workflow:
              raise SystemExit('Canonical release workflow did not parse as a GitHub workflow.')
          PY

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run complete test suite
        run: python -m unittest discover -s tests -v

      - name: Validate patch and commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f .github/workflows/apply-beta2-second-pass-v4.yml
          git diff --check
          git status --short
          git config user.name 'InfoMancer release bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete Beta 2 second-pass cleanup'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:release/0.8.1-beta.2
