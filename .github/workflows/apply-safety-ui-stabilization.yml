name: Apply Safety UI Stabilization

on:
  push:
    branches:
      - workspace/0.8-safety-ui-stabilization
    paths:
      - tools/apply_safety_ui_stabilization.py
      - .github/workflows/apply-safety-ui-stabilization.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply stabilization patch
        run: python tools/apply_safety_ui_stabilization.py
      - name: Fix library-default connection ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/mie.py")
          text = path.read_text(encoding="utf-8")
          old = '''    def _library_quality_defaults_raw(self, conn=None) -> dict[str, Any] | None:
        owns_connection = conn is None
        if owns_connection:
            conn = self.database.connect()
        try:
            row = conn.execute(
                "SELECT value FROM app_settings WHERE key='mie_quality_defaults'"
            ).fetchone()
            if not row or not row["value"]:
                return None
            value = json.loads(row["value"])
            return value if isinstance(value, dict) else None
        except (json.JSONDecodeError, TypeError):
            return None
        finally:
            if owns_connection:
                conn.close()
'''
          new = '''    def _library_quality_defaults_raw(self, conn=None) -> dict[str, Any] | None:
        if conn is None:
            with self.database.connect() as connection:
                return self._library_quality_defaults_raw(connection)
        row = conn.execute(
            "SELECT value FROM app_settings WHERE key='mie_quality_defaults'"
        ).fetchone()
        if not row or not row["value"]:
            return None
        try:
            value = json.loads(row["value"])
        except (json.JSONDecodeError, TypeError):
            return None
        return value if isinstance(value, dict) else None
'''
          if old not in text:
              raise SystemExit("quality-default connection helper marker not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Compile application
        run: python -m compileall app
      - name: Commit validated stabilization
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests
          git commit -m "Add safety modes and stabilize Workspace UI"
          gh auth setup-git
          git push origin HEAD:workspace/0.8-safety-ui-stabilization
