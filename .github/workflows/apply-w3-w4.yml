name: Apply W3 W4

on:
  workflow_dispatch:
  push:
    branches:
      - workspace/0.8-w3-w4
    paths:
      - scripts/apply_w3_w4.py
      - .github/workflows/apply-w3-w4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply W3 and W4
        run: |
          python scripts/apply_w3_w4.py
          python - <<'PY'
          from pathlib import Path
          test = Path('tests/test_review_workspace.py')
          text = test.read_text(encoding='utf-8')
          text = text.replace('self.assertEqual(view["visible_count"], 2)  # MIE finding plus failed metadata title search match', 'self.assertEqual(view["visible_count"], 1)')
          test.write_text(text, encoding='utf-8')
          ui = Path('app/static/workspace-ui.js')
          text = ui.read_text(encoding='utf-8')
          text = text.replace('const normalized = query.casefold ? query.casefold() : query.toLowerCase();', 'const normalized = query.toLowerCase();')
          ui.write_text(text, encoding='utf-8')
          PY

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

      - name: Compile application
        run: python -m compileall app

      - name: Commit validated W3 W4 tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app docs tests
          git commit -m "Build unified Review workspace and app interactions"
          gh auth setup-git
          git push origin HEAD:workspace/0.8-w3-w4
