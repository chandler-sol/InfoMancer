name: Finalize Beta 2 First Pass

on:
  push:
    branches:
      - release/0.8.1-beta.2
    paths:
      - .github/workflows/beta2-first-pass-finalize.yml

permissions:
  actions: read
  contents: write

env:
  APP_SHA: 4b8fc5273aef1c78450566720ae58dee43b3d545
  RELEASE_TAG: v0.8.1-beta.2
  INTEL_RUN: '34389090728'

jobs:
  source:
    name: Rebuild first-pass source package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact first-pass application commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.APP_SHA }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Stamp Beta 2 application version
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path('app/main.py')
          text = path.read_text(encoding='utf-8')
          updated, count = re.subn(
              r'^APP_VERSION\s*=\s*"[^"]+"',
              'APP_VERSION = "0.8.1-beta.2"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit('Could not stamp APP_VERSION')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Build credential-free source package
        run: python scripts/build_release.py

      - name: Upload source package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: infomancer-source-first-pass-final
          path: dist/InfoMancer-0.8.1-beta.2.zip
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble first-pass Beta 2 draft
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out current Beta 2 release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/0.8.1-beta.2
          persist-credentials: false

      - name: Download rebuilt source package
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: infomancer-source-first-pass-final
          path: collected/source

      - name: Wait for and download audited Intel first-pass DMG
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p collected/intel
          found=0
          for attempt in $(seq 1 90); do
            if gh run download "$INTEL_RUN" \
              --repo "$GITHUB_REPOSITORY" \
              --name infomancer-macos-intel-first-pass \
              --dir collected/intel 2>/dev/null; then
              found=1
              break
            fi
            echo "Intel first-pass artifact is not ready yet ($attempt/90)."
            sleep 20
          done
          if [ "$found" -ne 1 ]; then
            echo 'Audited Intel first-pass DMG did not become available.' >&2
            exit 1
          fi

      - name: Download already-verified first-pass platform packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p collected/windows collected/linux collected/arm64
          gh run download 34386671631 --repo "$GITHUB_REPOSITORY" --name infomancer-windows --dir collected/windows
          gh run download 34386671631 --repo "$GITHUB_REPOSITORY" --name infomancer-linux --dir collected/linux
          gh run download 34386671631 --repo "$GITHUB_REPOSITORY" --name infomancer-macos-arm64 --dir collected/arm64

      - name: Verify complete first-pass package set and generate checksums
        shell: bash
        run: |
          rm -rf publish
          mkdir -p publish
          find collected -type f -print0 | while IFS= read -r -d '' asset; do
            cp "$asset" "publish/$(basename "$asset")"
          done
          test -f publish/InfoMancer-0.8.1-beta.2-Windows-x64-Setup.exe
          test -f publish/InfoMancer-0.8.1-beta.2-macOS-Apple-Silicon.dmg
          test -f publish/InfoMancer-0.8.1-beta.2-macOS-Intel.dmg
          test -f publish/InfoMancer-0.8.1-beta.2-Linux-x86_64.deb
          test -f publish/InfoMancer-0.8.1-beta.2-Linux-x86_64.AppImage
          test -f publish/InfoMancer-0.8.1-beta.2.zip
          find publish -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#publish/##' > publish/SHA256SUMS.txt
          echo 'Verified first-pass Beta 2 package set:'
          find publish -maxdepth 1 -type f -printf '%f\n' | sort
          cat publish/SHA256SUMS.txt

      - name: Replace stale Beta 2 draft assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'InfoMancer 0.8.1-beta.2' \
            --notes-file docs/releases/0.8.1-beta.2.md \
            --draft \
            --prerelease
          gh release upload "$RELEASE_TAG" publish/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          echo 'First-pass Beta 2 draft assets replaced successfully.'
