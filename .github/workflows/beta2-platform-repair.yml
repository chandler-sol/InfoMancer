name: Beta 2 Platform Repair

on:
  push:
    branches:
      - release/0.8.1-beta.2
    paths:
      - .github/workflows/beta2-platform-repair.yml

permissions:
  actions: read
  contents: write

env:
  RELEASE_SHA: d9982b00937393f23087686a4cbd0fe63985a153
  RELEASE_TAG: v0.8.1-beta.2

jobs:
  windows:
    name: Rebuild Windows beta.2
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact beta.2 application commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.21.0

      - name: Build bundled InfoMancer core
        shell: pwsh
        run: |
          python scripts/stage_ffprobe.py
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --name infomancer-core --add-data "app/templates;app/templates" --add-data "app/static;app/static" --add-data "build/ffprobe/FFPROBE_LICENSE.txt;third-party/ffprobe" --add-data "build/ffprobe/FFPROBE_NOTICE.txt;third-party/ffprobe" --add-binary "build/ffprobe/ffprobe.exe;." desktop/sidecar.py
          & .\dist\infomancer-core.exe --check-ffprobe
          if ($LASTEXITCODE -ne 0) { throw "Bundled FFprobe self-check failed: $LASTEXITCODE" }
          $triple = (rustc --print host-tuple).Trim()
          New-Item -ItemType Directory -Force desktop/src-tauri/binaries | Out-Null
          Copy-Item dist/infomancer-core.exe "desktop/src-tauri/binaries/infomancer-core-$triple.exe"

      - name: Install and audit desktop dependencies
        working-directory: desktop
        shell: pwsh
        run: |
          npm ci --prefer-offline
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
          npm audit --audit-level=high
          if ($LASTEXITCODE -ne 0) { throw 'npm audit failed.' }
          npm run icon
          if ($LASTEXITCODE -ne 0) { throw 'Icon generation failed.' }

      - name: Build NSIS installer with transient download retry
        working-directory: desktop
        shell: pwsh
        run: |
          $built = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Windows NSIS packaging attempt $attempt of 3"
            npm run tauri -- build --bundles nsis
            if ($LASTEXITCODE -eq 0) {
              $built = $true
              break
            }
            if ($attempt -lt 3) {
              Write-Warning "NSIS packaging failed on attempt $attempt; retrying after transient download failure."
              Start-Sleep -Seconds 8
            }
          }
          if (-not $built) { throw 'Windows NSIS packaging failed after 3 attempts.' }

      - name: Verify Windows package
        shell: pwsh
        run: |
          $launcher = Resolve-Path 'desktop/src-tauri/target/release/infomancer-desktop.exe'
          $env:INFOMANCER_PE = $launcher.Path
          python -c "import os,struct; data=open(os.environ['INFOMANCER_PE'],'rb').read(); pe=struct.unpack_from('<I',data,0x3c)[0]; subsystem=struct.unpack_from('<H',data,pe+24+68)[0]; print(f'Windows PE subsystem={subsystem}'); assert subsystem == 2"
          $installer = Get-ChildItem 'desktop/src-tauri/target/release/bundle/nsis/*.exe' | Where-Object { $_.Name -like 'InfoMancer-0.8.1-beta.2-*' } | Select-Object -First 1
          if (-not $installer) { throw 'Canonical beta.2 Windows installer was not produced.' }
          Write-Host "Windows beta.2 installer: $($installer.FullName)"

      - name: Upload Windows beta.2 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: infomancer-windows-repair
          path: desktop/src-tauri/target/release/bundle/nsis/InfoMancer-0.8.1-beta.2-*.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  assemble:
    name: Assemble complete beta.2 draft release
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out beta.2 release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/0.8.1-beta.2
          persist-credentials: false

      - name: Download rebuilt Windows artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: infomancer-windows-repair
          path: collected/windows

      - name: Download successful beta.2 artifacts from full matrix
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p collected/matrix
          gh run download 34267126464 \
            --repo "$GITHUB_REPOSITORY" \
            --name infomancer-source \
            --name infomancer-linux \
            --name infomancer-macos-arm64 \
            --dir collected/matrix

      - name: Download exact beta.2 Intel DMG already published
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p collected/intel
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'InfoMancer-0.8.1-beta.2-macOS-Intel.dmg' \
            --dir collected/intel

      - name: Flatten packages and generate checksums
        shell: bash
        run: |
          rm -rf publish
          mkdir -p publish
          find collected -type f -print0 | while IFS= read -r -d '' asset; do
            cp "$asset" "publish/$(basename "$asset")"
          done
          echo 'Complete beta.2 package set:'
          find publish -maxdepth 1 -type f -printf '%f\n' | sort
          find publish -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#publish/##' > publish/SHA256SUMS.txt
          cat publish/SHA256SUMS.txt

      - name: Verify every beta.2 platform is present
        shell: bash
        run: |
          test -f publish/InfoMancer-0.8.1-beta.2-Windows-x64-Setup.exe
          test -f publish/InfoMancer-0.8.1-beta.2-macOS-Apple-Silicon.dmg
          test -f publish/InfoMancer-0.8.1-beta.2-macOS-Intel.dmg
          test -f publish/InfoMancer-0.8.1-beta.2-Linux-x86_64.deb
          test -f publish/InfoMancer-0.8.1-beta.2-Linux-x86_64.AppImage
          test -f publish/InfoMancer-0.8.1-beta.2.zip
          test -f publish/SHA256SUMS.txt

      - name: Update existing beta.2 draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'InfoMancer 0.8.1-beta.2' \
            --notes-file docs/releases/0.8.1-beta.2.md \
            --draft \
            --prerelease
          gh release upload "$RELEASE_TAG" publish/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          echo 'Complete all-platform 0.8.1-beta.2 draft release assembled.'
