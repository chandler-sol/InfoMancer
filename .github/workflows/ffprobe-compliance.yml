name: FFprobe Compliance

on:
  pull_request:
    paths:
      - scripts/build_minimal_ffprobe.sh
      - scripts/stage_ffprobe.py
      - tests/test_ffprobe_packaging.py
      - docs/FFPROBE_DISTRIBUTION.md
      - docs/PACKAGING.md
      - app/templates/about.html
      - desktop/src-tauri/tauri.windows.conf.json
      - .github/workflows/ffprobe-compliance.yml
      - .github/workflows/windows-desktop.yml
      - .github/workflows/windows-desktop-release.yml
  push:
    branches:
      - testing/0.9-alpha-reseed
    paths:
      - scripts/build_minimal_ffprobe.sh
      - scripts/stage_ffprobe.py
      - tests/test_ffprobe_packaging.py
      - docs/FFPROBE_DISTRIBUTION.md
      - docs/PACKAGING.md
      - app/templates/about.html
      - desktop/src-tauri/tauri.windows.conf.json
      - .github/workflows/ffprobe-compliance.yml
      - .github/workflows/windows-desktop.yml
      - .github/workflows/windows-desktop-release.yml

permissions:
  contents: read

concurrency:
  group: ffprobe-compliance-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-minimal-windows-ffprobe:
    name: Build minimal Windows FFprobe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install MinGW cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-mingw-w64-x86-64

      - name: Build minimal FFprobe from pinned FFmpeg source
        run: bash scripts/build_minimal_ffprobe.sh build/minimal-ffprobe

      - name: Reject optional third-party runtime dependencies
        run: |
          cat build/minimal-ffprobe/FFPROBE_DLL_DEPENDENCIES.txt
          if grep -Eiq 'libgcc|libstdc\+\+|libwinpthread|libiconv|libz|avcodec|avformat|avutil|swresample|swscale' build/minimal-ffprobe/FFPROBE_DLL_DEPENDENCIES.txt; then
            echo 'Unexpected non-system DLL dependency in minimal FFprobe build.' >&2
            exit 1
          fi
          grep -Fx 'ad500d59cb6e0126add4fcb95afb4e2557c4292c' build/minimal-ffprobe/FFPROBE_SOURCE_COMMIT.txt
          grep -Fx 'infomancer-ad500d59cb' build/minimal-ffprobe/FFPROBE_BUILD_MARKER.txt

      - name: Upload minimal FFprobe compliance bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: minimal-ffprobe-win64
          path: build/minimal-ffprobe/
          if-no-files-found: error
          retention-days: 7

  verify-minimal-windows-ffprobe:
    name: Execute and verify minimal Windows FFprobe
    needs: build-minimal-windows-ffprobe
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Download minimal FFprobe compliance bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: minimal-ffprobe-win64
          path: build/minimal-ffprobe

      - name: Execute compliance verifier and stage native payload
        run: python scripts/stage_ffprobe.py --input build/minimal-ffprobe --output build/ffprobe

      - name: Verify staged redistribution evidence
        shell: bash
        run: |
          test -f build/ffprobe/ffprobe.exe
          test -f build/ffprobe/FFPROBE_LICENSE.txt
          test -f build/ffprobe/FFPROBE_NOTICE.txt
          test -f build/ffprobe/FFPROBE_BUILDINFO.txt
          test -f build/ffprobe/FFPROBE_BUILD_SCRIPT.sh
          test -f build/ffprobe/FFPROBE_SOURCE_COMMIT.txt
          test -f build/ffprobe/FFPROBE_BUILD_MARKER.txt
          grep -F -- '--disable-autodetect' build/ffprobe/FFPROBE_BUILDINFO.txt
          grep -F -- '--extra-version=infomancer-ad500d59cb' build/ffprobe/FFPROBE_BUILDINFO.txt
          grep -F -- 'infomancer-ad500d59cb' build/ffprobe/FFPROBE_BUILDINFO.txt
          grep -F -- 'Independent JPEG Group' build/ffprobe/FFPROBE_NOTICE.txt
          if grep -Eiq -- '--enable-(gpl|nonfree|version3|lib[^ ]*)' build/ffprobe/FFPROBE_BUILDINFO.txt; then
            echo 'Disallowed FFprobe configuration survived staging.' >&2
            exit 1
          fi
          cat build/ffprobe/FFPROBE_BUILDINFO.txt
