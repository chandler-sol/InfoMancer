name: Finalize Safety UI Stabilization

on:
  push:
    branches:
      - workspace/0.8-safety-ui-stabilization
    paths:
      - tools/finalize_safety_ui_stabilization.py
      - .github/workflows/finalize-safety-ui-stabilization.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply final cleanup
        run: python tools/finalize_safety_ui_stabilization.py
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Compile application
        run: python -m compileall app
      - name: Commit validated cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests
          git commit -m "Finish safety mode and UI stabilization"
          gh auth setup-git
          git push origin HEAD:workspace/0.8-safety-ui-stabilization
