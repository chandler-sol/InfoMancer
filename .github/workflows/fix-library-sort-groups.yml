name: Fix Library Sort Groups

on:
  push:
    branches:
      - workspace/0.8-foundation
    paths:
      - .github/workflows/fix-library-sort-groups.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Workspace branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Align library grouping with article-stripped sort key
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('app/main.py')
          text = main.read_text(encoding='utf-8')
          old = '''def title_initial(row) -> str:\n    name = (row["metadata_title"] or row["title"] or "").strip()\n    return name[0].upper() if name and name[0].isalpha() else "#"\n'''
          new = '''def title_initial(row) -> str:\n    try:\n        sort_title = str(row["sort_title"] or "").strip()\n    except (KeyError, IndexError, TypeError):\n        sort_title = ""\n    name = sort_title or (row["metadata_title"] or row["title"] or "").strip()\n    lowered = name.casefold()\n    for article in ("the ", "an ", "a "):\n        if lowered.startswith(article):\n            name = name[len(article):].lstrip()\n            break\n    return name[0].upper() if name and name[0].isalpha() else "#"\n'''
          if old not in text:
              raise SystemExit('title_initial marker not found')
          main.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_sort_titles.py')
          text = test.read_text(encoding='utf-8')
          old = '''    def test_alphabetical_uses_sort_title_and_ignores_leading_articles(self):\n        page = self.client.get("/movies")\n        self.assertLess(page.text.index("The Batman"), page.text.index("2 Fast 2 Furious"))\n        self.assertLess(page.text.index("Fast &amp; Furious"), page.text.index("2 Fast 2 Furious"))\n        self.assertIn("The Batman", self.client.get("/movies?letter=B").text)\n        self.assertNotIn("The Batman", self.client.get("/movies?letter=T").text)\n'''
          new = '''    def test_alphabetical_uses_sort_title_and_ignores_leading_articles(self):\n        page = self.client.get("/movies")\n        self.assertLess(page.text.index("The Batman"), page.text.index("2 Fast 2 Furious"))\n        self.assertLess(page.text.index("Fast &amp; Furious"), page.text.index("2 Fast 2 Furious"))\n        self.assertIn('id="letter-B"', page.text)\n        self.assertLess(page.text.index('id="letter-B"'), page.text.index("The Batman"))\n        self.assertNotIn('id="letter-T"', page.text)\n        self.assertIn("The Batman", self.client.get("/movies?letter=B").text)\n        self.assertNotIn("The Batman", self.client.get("/movies?letter=T").text)\n'''
          if old not in text:
              raise SystemExit('sort-title test marker not found')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Compile application
        run: python -m compileall app
      - name: Commit library grouping fix
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py tests/test_sort_titles.py
          git commit -m "Align library headings with article-stripped sorting"
          gh auth setup-git
          git push origin HEAD:workspace/0.8-foundation
