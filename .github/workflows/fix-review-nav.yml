name: Fix Review Nav

on:
  workflow_dispatch:
  push:
    branches:
      - workspace/0.8-w3-w4
    paths:
      - .github/workflows/fix-review-nav.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fix Review domain active state
        run: |
          python - <<'PY'
          from pathlib import Path
          base = Path('app/templates/base.html')
          text = base.read_text(encoding='utf-8')
          old = '<a href="/review" title="Review"{% if request.url.path == \'/review\' %} class="active" aria-current="page"{% elif workspace_review_active %} class="domain-current"{% endif %}>'
          new = '<a href="/review" title="Review"{% if workspace_review_active %} class="domain-current"{% endif %}>'
          if old not in text:
              raise SystemExit('Review parent active-state marker not found')
          base.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_review_workspace.py')
          text = test.read_text(encoding='utf-8')
          marker = '        self.assertIn(\'href="/review" title="Review"\', base)\n'
          addition = '        self.assertIn(\'href="/review" title="Review"{% if workspace_review_active %} class="domain-current"{% endif %}\', base)\n'
          if marker not in text:
              raise SystemExit('Review navigation contract marker not found')
          test.write_text(text.replace(marker, marker + addition, 1), encoding='utf-8')
          PY

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

      - name: Compile application
        run: python -m compileall app

      - name: Commit navigation fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/templates/base.html tests/test_review_workspace.py
          git commit -m "Keep Review domain contextual when queue is active"
          gh auth setup-git
          git push origin HEAD:workspace/0.8-w3-w4
