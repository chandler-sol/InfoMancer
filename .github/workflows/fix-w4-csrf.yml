name: Fix W4 CSRF

on:
  workflow_dispatch:
  push:
    branches:
      - workspace/0.8-w3-w4
    paths:
      - .github/workflows/fix-w4-csrf.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Carry CSRF token into multipart request header
        run: |
          python - <<'PY'
          from pathlib import Path
          ui = Path('app/static/workspace-ui.js')
          text = ui.read_text(encoding='utf-8')
          old = '''    const submitters = [...form.querySelectorAll('button[type="submit"], input[type="submit"]')];\n    submitters.forEach(button => button.disabled = true);\n    form.classList.add("workspace-action-busy");\n    try {\n      const response = await fetch(action, {\n        method: (form.method || "POST").toUpperCase(),\n        credentials: "same-origin",\n        body: new FormData(form),\n        headers: {"Accept": "application/json", "X-Workspace-Action": "1"},\n      });\n'''
          new = '''    const submitters = [...form.querySelectorAll('button[type="submit"], input[type="submit"]')];\n    const csrfToken = form.querySelector('input[name="csrf_token"]')?.value || "";\n    submitters.forEach(button => button.disabled = true);\n    form.classList.add("workspace-action-busy");\n    try {\n      const response = await fetch(action, {\n        method: (form.method || "POST").toUpperCase(),\n        credentials: "same-origin",\n        body: new FormData(form),\n        headers: {\n          "Accept": "application/json",\n          "X-Workspace-Action": "1",\n          ...(csrfToken ? {"X-CSRF-Token": csrfToken} : {}),\n        },\n      });\n'''
          if old not in text:
              raise SystemExit('W4 AJAX fetch marker not found')
          ui.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_review_workspace.py')
          text = test.read_text(encoding='utf-8')
          marker = '        self.assertIn("data-workspace-menu-toggle", ui)\n'
          addition = '        self.assertIn("X-CSRF-Token", ui)\n        self.assertIn(\'input[name="csrf_token"]\', ui)\n'
          if marker not in text:
              raise SystemExit('W4 UI contract marker not found')
          test.write_text(text.replace(marker, marker + addition, 1), encoding='utf-8')
          PY

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

      - name: Compile application
        run: python -m compileall app

      - name: Commit CSRF integration fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/workspace-ui.js tests/test_review_workspace.py
          git commit -m "Preserve hardened CSRF boundary for Workspace actions"
          gh auth setup-git
          git push origin HEAD:workspace/0.8-w3-w4
