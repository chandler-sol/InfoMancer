name: Harden Review Visibility

on:
  workflow_dispatch:
  push:
    branches:
      - workspace/0.8-w3-w4
    paths:
      - .github/workflows/harden-review-visibility.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Keep operational failures Librarian-only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/review_queue.py')
          text = path.read_text(encoding='utf-8')
          old = '''        if status == "active":\n            items.extend(self._metadata_items())\n            if include_librarian:\n                items.extend(self._duplicate_item(item) for item in self.duplicates.candidates(status="active"))\n'''
          new = '''        if status == "active" and include_librarian:\n            items.extend(self._metadata_items())\n            items.extend(self._duplicate_item(item) for item in self.duplicates.candidates(status="active"))\n'''
          if old not in text:
              raise SystemExit('Active operational queue marker not found')
          text = text.replace(old, new, 1)
          old = '''        if source == "metadata" and item_id.isdigit():\n            target = f"metadata:{int(item_id)}"\n            return next((item for item in self._metadata_items() if item["key"] == target), None)\n'''
          new = '''        if source == "metadata" and include_librarian and item_id.isdigit():\n            target = f"metadata:{int(item_id)}"\n            return next((item for item in self._metadata_items() if item["key"] == target), None)\n'''
          if old not in text:
              raise SystemExit('Metadata drawer marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_review_workspace.py')
          text = test.read_text(encoding='utf-8')
          old = '''        self.assertNotIn("duplicate", {item["source"] for item in view["items"]})\n        self.assertTrue(any(item["bucket"] == "matching" for item in view["items"]))\n'''
          new = '''        sources = {item["source"] for item in view["items"]}\n        self.assertNotIn("duplicate", sources)\n        self.assertNotIn("metadata", sources)\n        self.assertTrue(any(item["bucket"] == "matching" for item in view["items"]))\n        self.assertIsNone(self.queue.get_item("metadata", "1", include_librarian=False))\n        self.assertIsNotNone(self.queue.get_item("metadata", "1", include_librarian=True))\n'''
          if old not in text:
              raise SystemExit('Member visibility test marker not found')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

      - name: Compile application
        run: python -m compileall app

      - name: Commit visibility hardening
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/review_queue.py tests/test_review_workspace.py
          git commit -m "Keep Review operational failures Librarian-only"
          gh auth setup-git
          git push origin HEAD:workspace/0.8-w3-w4
