name: Priority macOS Intel Desktop Build

on:
  workflow_dispatch:
  push:
    branches:
      - testing/0.8-beta
      - 'release/**'
    paths:
      - .github/workflows/macos-intel-priority.yml
      - desktop/**
      - app/**
      - scripts/stage_ffprobe.py
      - scripts/verify_macos_minos.py
      - requirements.txt

permissions:
  actions: read
  contents: read

concurrency:
  group: macos-intel-priority-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  MACOSX_DEPLOYMENT_TARGET: '13.0'
  CMAKE_OSX_DEPLOYMENT_TARGET: '13.0'

jobs:
  macos-intel:
    name: macOS Intel priority DMG
    runs-on: macos-26-intel
    timeout-minutes: 50
    steps:
      - name: Check out build commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stamp beta.2 application version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/main.py')
          text = path.read_text(encoding='utf-8')
          old = 'APP_VERSION = "0.8.1-beta.1"'
          new = 'APP_VERSION = "0.8.1-beta.2"'
          if new not in text:
              if old not in text:
                  raise SystemExit('Could not locate the beta.1 APP_VERSION to stamp beta.2')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('Stamped InfoMancer application version 0.8.1-beta.2')
          PY

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Restore Rust build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: macos-intel-priority-cargo-macos13-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            macos-intel-priority-cargo-macos13-

      - name: Restore verified FFprobe stage
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/ffprobe
          key: macos-intel-priority-ffprobe-${{ hashFiles('scripts/stage_ffprobe.py') }}
          restore-keys: |
            macos-intel-priority-ffprobe-
            macOS-X64-ffprobe-

      - name: Restore static cryptography wheel
        id: crypto-wheel-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/macos-intel-wheels
          key: macos-intel-static-cryptography-py313-macos13-${{ hashFiles('requirements.txt') }}

      - name: Verify toolchain
        shell: bash
        run: |
          python --version
          node --version
          npm --version
          rustc --version
          cargo --version
          echo "Intel macOS deployment target: $MACOSX_DEPLOYMENT_TARGET"

      - name: Build static cryptography wheel
        if: steps.crypto-wheel-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          crypto_requirement="$(grep -E '^cryptography==' requirements.txt | head -n 1)"
          if [ -z "$crypto_requirement" ]; then
            echo 'Pinned cryptography requirement was not found.' >&2
            exit 1
          fi
          mkdir -p build/macos-intel-wheels
          env \
            OPENSSL_DIR="$(brew --prefix openssl@3)" \
            OPENSSL_STATIC=1 \
            python -m pip wheel \
              --no-cache-dir \
              --no-deps \
              --no-binary cryptography \
              --wheel-dir build/macos-intel-wheels \
              "$crypto_requirement"

      - name: Install static cryptography wheel
        shell: bash
        run: |
          crypto_requirement="$(grep -E '^cryptography==' requirements.txt | head -n 1)"
          python -m pip install \
            --no-index \
            --no-deps \
            --find-links build/macos-intel-wheels \
            "$crypto_requirement"

      - name: Install Python build dependencies
        shell: bash
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.21.0

      - name: Verify cryptography OpenSSL linkage
        shell: bash
        run: |
          crypto_rust="$(python - <<'PY'
          import cryptography.hazmat.bindings._rust as rust
          print(rust.__file__)
          PY
          )"
          echo "cryptography native module: $crypto_rust"
          otool -L "$crypto_rust"
          if otool -L "$crypto_rust" | grep -Eq 'libssl|libcrypto'; then
            echo 'cryptography is dynamically linked to OpenSSL; refusing to package a mismatched OpenSSL pair.' >&2
            exit 1
          fi
          python scripts/verify_macos_minos.py --max-version "$MACOSX_DEPLOYMENT_TARGET" "$crypto_rust"

      - name: Build bundled core
        shell: bash
        run: |
          python scripts/stage_ffprobe.py
          python -m PyInstaller --noconfirm --onefile --name infomancer-core \
            --add-data "app/templates:app/templates" \
            --add-data "app/static:app/static" \
            --add-data "build/ffprobe/FFPROBE_LICENSE.txt:third-party/ffprobe" \
            --add-data "build/ffprobe/FFPROBE_NOTICE.txt:third-party/ffprobe" \
            --add-binary "build/ffprobe/ffprobe:." \
            desktop/sidecar.py
          ./dist/infomancer-core --check-ffprobe
          triple="$(rustc --print host-tuple)"
          mkdir -p desktop/src-tauri/binaries
          cp dist/infomancer-core "desktop/src-tauri/binaries/infomancer-core-$triple"
          chmod +x "desktop/src-tauri/binaries/infomancer-core-$triple"

      - name: Smoke-test packaged core and audit embedded macOS compatibility
        shell: bash
        run: |
          smoke_dir="$RUNNER_TEMP/infomancer-core-smoke"
          smoke_log="$RUNNER_TEMP/infomancer-core-smoke.log"
          pyi_tmp="$RUNNER_TEMP/infomancer-pyi-smoke"
          rm -rf "$smoke_dir" "$pyi_tmp"
          rm -f "$smoke_log"
          mkdir -p "$pyi_tmp"
          port="$(python - <<'PY'
          import socket
          with socket.socket() as sock:
              sock.bind(('127.0.0.1', 0))
              print(sock.getsockname()[1])
          PY
          )"
          export INFOMANCER_SMOKE_PORT="$port"
          TMPDIR="$pyi_tmp" ./dist/infomancer-core --port "$port" --data-dir "$smoke_dir" >"$smoke_log" 2>&1 &
          core_pid=$!
          cleanup() {
            kill "$core_pid" 2>/dev/null || true
            wait "$core_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in {1..60}; do
            if ! kill -0 "$core_pid" 2>/dev/null; then
              echo 'Packaged InfoMancer core exited before opening its loopback listener.' >&2
              cat "$smoke_log" >&2 || true
              wait "$core_pid" || true
              exit 1
            fi
            if python - <<'PY'
          import os
          import socket
          port = int(os.environ['INFOMANCER_SMOKE_PORT'])
          try:
              with socket.create_connection(('127.0.0.1', port), timeout=0.25):
                  pass
          except OSError:
              raise SystemExit(1)
          PY
            then
              ready=1
              break
            fi
            sleep 0.5
          done

          if [ "$ready" -ne 1 ]; then
            echo 'Packaged InfoMancer core did not become ready during the smoke-test window.' >&2
            cat "$smoke_log" >&2 || true
            exit 1
          fi

          echo "Packaged InfoMancer core became ready on 127.0.0.1:$port."
          echo 'Auditing the one-file executable and its live PyInstaller extraction tree...'
          python scripts/verify_macos_minos.py \
            --max-version "$MACOSX_DEPLOYMENT_TARGET" \
            ./dist/infomancer-core \
            ./build/ffprobe/ffprobe \
            "$pyi_tmp"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --prefer-offline

      - name: Generate native icons
        working-directory: desktop
        run: npm run icon

      - name: Build Intel DMG
        working-directory: desktop
        run: npm run tauri -- build --bundles dmg

      - name: Verify finished Intel DMG supports macOS 13
        shell: bash
        run: |
          dmg="$(find desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [ -z "$dmg" ]; then
            echo 'Built macOS DMG was not found.' >&2
            exit 1
          fi

          mount_dir="$RUNNER_TEMP/infomancer-dmg-audit"
          rm -rf "$mount_dir"
          mkdir -p "$mount_dir"

          cleanup_mount() {
            hdiutil detach "$mount_dir" -quiet 2>/dev/null || true
          }
          trap cleanup_mount EXIT

          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir" -quiet
          app_dir="$(find "$mount_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$app_dir" ]; then
            echo 'InfoMancer.app was not found inside the built DMG.' >&2
            find "$mount_dir" -maxdepth 2 -print >&2 || true
            exit 1
          fi

          echo "Auditing shipped app bundle from DMG: $app_dir"
          python scripts/verify_macos_minos.py \
            --max-version "$MACOSX_DEPLOYMENT_TARGET" \
            "$app_dir"

      - name: Upload Intel DMG first
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infomancer-macos-intel-priority
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
