name: Optimize Review Queue

on:
  workflow_dispatch:
  push:
    branches:
      - workspace/0.8-foundation
    paths:
      - .github/workflows/optimize-review-queue.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Workspace branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Reuse current queue for current status count
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/review_queue.py')
          text = path.read_text(encoding='utf-8')
          old = '''        status_counts = {\n            review_status: len(self._all_items(\n                status=review_status, include_librarian=include_librarian,\n            ))\n            for review_status in ("active", "dismissed", "resolved")\n        }\n'''
          new = '''        status_counts = {}\n        for review_status in ("active", "dismissed", "resolved"):\n            if review_status == status:\n                status_counts[review_status] = len(all_items)\n            else:\n                status_counts[review_status] = len(self._all_items(\n                    status=review_status, include_librarian=include_librarian,\n                ))\n'''
          if old not in text:
              raise SystemExit('Review status-count marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_review_workspace.py')
          text = test.read_text(encoding='utf-8')
          marker = '        self.assertEqual(view["status_counts"]["active"], view["counts"]["total"])\n'
          addition = '        self.assertEqual(view["status_counts"]["active"], view["total"])\n'
          if marker not in text:
              raise SystemExit('Review status-count test marker not found')
          test.write_text(text.replace(marker, marker + addition, 1), encoding='utf-8')
          PY

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

      - name: Compile application
        run: python -m compileall app

      - name: Commit queue optimization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/review_queue.py tests/test_review_workspace.py
          git commit -m "Avoid duplicate active Review queue analysis"
          gh auth setup-git
          git push origin HEAD:workspace/0.8-foundation
