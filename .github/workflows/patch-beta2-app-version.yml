name: Align Beta 2 Application Version

on:
  push:
    branches:
      - release/0.8.1-beta.2
    paths:
      - .github/workflows/patch-beta2-app-version.yml

permissions:
  contents: write

jobs:
  align-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Beta 2 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/0.8.1-beta.2
      - name: Align source version with Beta 2
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/main.py')
          text = path.read_text(encoding='utf-8')
          old = 'APP_VERSION = "0.8.1-beta.1"'
          new = 'APP_VERSION = "0.8.1-beta.2"'
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit('Expected Beta 1 APP_VERSION marker was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit source version alignment
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.py
          git diff --cached --check
          git commit -m 'Align application version with Beta 2'
          git push origin HEAD:release/0.8.1-beta.2
