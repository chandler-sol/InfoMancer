name: Validate Beta 2 Server Setup and Refresh Release Inputs

on:
  push:
    branches:
      - release/0.8.1-beta.2
    paths:
      - .github/workflows/patch-beta2-server-release-inputs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Beta 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/0.8.1-beta.2
          persist-credentials: false

      - name: Validate Server helper syntax and contracts
        shell: bash
        run: |
          sh -n setup-infomancer.sh
          python -m unittest tests.test_server_setup_helpers -v
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "./Setup-InfoMancer.ps1"), [ref]$tokens, [ref]$errors) > $null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'
          fi

      - name: Make canonical release workflow watch Server package inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/draft-08-release.yml')
          text = path.read_text(encoding='utf-8')
          needle = '''      - scripts/verify_macos_minos.py
                - requirements.txt
          '''.replace('                ', '      ')
          replacement = '''      - scripts/verify_macos_minos.py
                - requirements.txt
                - README.md
                - START-HERE.txt
                - Setup-InfoMancer.*
                - setup-infomancer.sh
                - Dockerfile
                - .dockerignore
                - .env.example
                - compose*.yaml
                - deploy/**
                - docs/**
                - scripts/build_release.py
          '''.replace('                ', '      ')
          if needle not in text:
              raise SystemExit('Expected release workflow path block was not found.')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          Path('.github/workflows/patch-beta2-server-release-inputs.yml').unlink()
          PY

          git diff --check

      - name: Commit validated Server setup changes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'InfoMancer release bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/draft-08-release.yml .github/workflows/patch-beta2-server-release-inputs.yml
          git commit -m 'Watch Server package inputs in Beta 2 release workflow'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:release/0.8.1-beta.2
