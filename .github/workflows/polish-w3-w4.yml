name: Polish W3 W4

on:
  workflow_dispatch:
  push:
    branches:
      - workspace/0.8-w3-w4
    paths:
      - scripts/polish_w3_w4.py
      - .github/workflows/polish-w3-w4.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply review polish
        run: python scripts/polish_w3_w4.py

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

      - name: Compile application
        run: python -m compileall app

      - name: Commit validated polish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests
          git commit -m "Polish Review queue counts and interactions"
          gh auth setup-git
          git push origin HEAD:workspace/0.8-w3-w4
