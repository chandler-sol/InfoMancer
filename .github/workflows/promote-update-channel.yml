name: Promote Qualified Update Channel

on:
  workflow_dispatch:
    inputs:
      source_channel:
        description: Qualified source channel
        required: true
        type: choice
        options:
          - dev
          - beta
      target_channel:
        description: More stable target channel
        required: true
        type: choice
        options:
          - beta
          - standard
      target_version:
        description: Target release version, for example 0.9.0-beta.1 or 0.9.0
        required: true
        type: string
      release_notes_url:
        description: Optional release notes URL
        required: false
        type: string

permissions:
  contents: write

jobs:
  promote-windows:
    name: Promote exact qualified build
    if: github.actor == github.repository_owner
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Validate promotion direction
        shell: pwsh
        run: |
          $source = '${{ inputs.source_channel }}'
          $target = '${{ inputs.target_channel }}'
          if ($source -eq 'beta' -and $target -ne 'standard') {
            throw 'Beta can only be promoted to Standard.'
          }
          if ($source -eq 'dev' -and $target -notin @('beta', 'standard')) {
            throw 'Dev can only be promoted to Beta or Standard.'
          }

      - name: Download qualified source manifest
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'source-channel'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $name = '${{ inputs.source_channel }}.json'
          gh release download update-channels --repo $env:GITHUB_REPOSITORY --pattern $name --dir $dir
          $path = Join-Path $dir $name
          if (-not (Test-Path $path)) { throw "Qualified source manifest $name was not found." }
          $manifest = Get-Content $path -Raw | ConvertFrom-Json
          if ($manifest.channel -ne '${{ inputs.source_channel }}') { throw 'Downloaded source manifest channel did not match the requested source.' }
          if ($manifest.qualification.status -ne 'passed') { throw 'Source manifest is not backed by a passed qualification.' }
          if ($manifest.commit_sha -notmatch '^[0-9a-fA-F]{40}$') { throw 'Source manifest commit SHA is invalid.' }
          "manifest_path=$path" >> $env:GITHUB_OUTPUT
          "commit_sha=$($manifest.commit_sha)" >> $env:GITHUB_OUTPUT
          "build_id=$($manifest.build_id)" >> $env:GITHUB_OUTPUT
          "source_version=$($manifest.version)" >> $env:GITHUB_OUTPUT

      - name: Check out exact qualified source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.commit_sha }}
          persist-credentials: false

      - name: Require updater signing configuration
        shell: pwsh
        env:
          INFOMANCER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          INFOMANCER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:INFOMANCER_PUBLIC_KEY)) {
            throw 'Set repository variable TAURI_UPDATER_PUBLIC_KEY before promoting a desktop build.'
          }
          if ([string]::IsNullOrWhiteSpace($env:INFOMANCER_PRIVATE_KEY)) {
            throw 'Set Actions secret TAURI_SIGNING_PRIVATE_KEY before promoting a desktop build.'
          }

      - name: Set promotion identity
        id: identity
        shell: pwsh
        run: |
          $targetVersion = '${{ inputs.target_version }}'.Trim().TrimStart('v')
          $targetChannel = '${{ inputs.target_channel }}'
          if ($targetChannel -eq 'standard' -and $targetVersion.Contains('-')) {
            throw 'Standard promotion requires a stable version without a prerelease suffix.'
          }
          if ($targetChannel -eq 'beta' -and $targetVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+-(beta|rc)(\.|$)') {
            throw 'Beta promotion requires a beta or rc version.'
          }
          $shortSha = '${{ steps.source.outputs.commit_sha }}'.Substring(0, 8)
          $tag = "desktop-$targetChannel-$targetVersion-$shortSha"
          "version=$targetVersion" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.21.0

      - name: Stamp promoted version into build workspace
        run: python scripts/stamp_build_version.py "${{ steps.identity.outputs.version }}"

      - name: Build bundled InfoMancer core
        shell: pwsh
        run: |
          python scripts/stage_ffprobe.py
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --name infomancer-core --add-data "app/templates;app/templates" --add-data "app/static;app/static" --add-data "build/ffprobe/FFPROBE_LICENSE.txt;third-party/ffprobe" --add-data "build/ffprobe/FFPROBE_NOTICE.txt;third-party/ffprobe" --add-binary "build/ffprobe/ffprobe.exe;." desktop/sidecar.py
          & .\dist\infomancer-core.exe --check-ffprobe
          if ($LASTEXITCODE -ne 0) { throw "Bundled FFprobe self-check failed: $LASTEXITCODE" }
          $triple = (rustc --print host-tuple).Trim()
          New-Item -ItemType Directory -Force desktop/src-tauri/binaries | Out-Null
          Copy-Item dist/infomancer-core.exe "desktop/src-tauri/binaries/infomancer-core-$triple.exe"

      - name: Install and audit desktop dependencies
        working-directory: desktop
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Generate native icons
        working-directory: desktop
        run: npm run icon

      - name: Verify promoted packaging versions
        run: python -m unittest tests.test_windows_desktop -v

      - name: Reserve promoted release at qualified source commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTED_TAG: ${{ steps.identity.outputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.commit_sha }}
        run: |
          gh release view $env:PROMOTED_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:PROMOTED_TAG already exists. Promotion is fail-closed so an existing immutable release is never overwritten; choose a new target version."
          }
          $title = 'InfoMancer ${{ steps.identity.outputs.version }}'
          $notes = 'Promoted from qualified ${{ inputs.source_channel }} build ${{ steps.source.outputs.build_id }} at commit ${{ steps.source.outputs.commit_sha }}. No source commit was substituted during promotion.'
          if ('${{ inputs.target_channel }}' -eq 'standard') {
            gh release create $env:PROMOTED_TAG --repo $env:GITHUB_REPOSITORY --target $env:SOURCE_SHA --title $title --notes $notes
          } else {
            gh release create $env:PROMOTED_TAG --repo $env:GITHUB_REPOSITORY --target $env:SOURCE_SHA --title $title --notes $notes --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not reserve the promoted release.' }
          $tagLine = git ls-remote "https://github.com/$env:GITHUB_REPOSITORY.git" "refs/tags/$env:PROMOTED_TAG"
          if ([string]::IsNullOrWhiteSpace($tagLine) -or -not $tagLine.StartsWith($env:SOURCE_SHA)) {
            throw 'The promoted release tag does not resolve to the exact qualified source commit.'
          }

      - name: Build, sign, and publish immutable promoted Windows updater
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          INFOMANCER_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        with:
          projectPath: desktop
          tagName: ${{ steps.identity.outputs.tag }}
          releaseName: InfoMancer ${{ steps.identity.outputs.version }}
          releaseBody: Promoted from qualified ${{ inputs.source_channel }} build ${{ steps.source.outputs.build_id }} at commit ${{ steps.source.outputs.commit_sha }}. No source commit was substituted during promotion.
          releaseDraft: false
          prerelease: ${{ inputs.target_channel != 'standard' }}
          args: --bundles nsis --config src-tauri/tauri.release.conf.json
          updaterJsonPreferNsis: true
          includeUpdaterJson: true

      - name: Resolve promoted updater assets
        id: assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTED_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          $published = Join-Path $env:RUNNER_TEMP 'published-promotion'
          New-Item -ItemType Directory -Force $published | Out-Null
          gh release download $env:PROMOTED_TAG --repo $env:GITHUB_REPOSITORY --pattern latest.json --dir $published
          $release = gh release view $env:PROMOTED_TAG --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          $installer = $release.assets | Where-Object { $_.name -like '*.exe' -and $_.name -notlike '*.sig' } | Select-Object -First 1
          if ($null -eq $installer) { throw 'The promoted release did not contain a Windows installer asset.' }
          $signatureName = "$($installer.name).sig"
          $signature = $release.assets | Where-Object { $_.name -eq $signatureName } | Select-Object -First 1
          if ($null -eq $signature) { throw 'The promoted release did not contain the updater signature for the Windows installer.' }
          gh release download $env:PROMOTED_TAG --repo $env:GITHUB_REPOSITORY --pattern $installer.name --dir $published
          gh release download $env:PROMOTED_TAG --repo $env:GITHUB_REPOSITORY --pattern $signature.name --dir $published
          $installerPath = Join-Path $published $installer.name
          $signaturePath = Join-Path $published $signature.name
          if ([string]::IsNullOrWhiteSpace((Get-Content $signaturePath -Raw))) { throw 'The published updater signature was empty.' }
          "published_dir=$published" >> $env:GITHUB_OUTPUT
          "installer_path=$installerPath" >> $env:GITHUB_OUTPUT
          "signature_path=$signaturePath" >> $env:GITHUB_OUTPUT
          "installer_url=$($installer.url)" >> $env:GITHUB_OUTPUT

      - name: Build promoted qualified channel manifest
        shell: pwsh
        run: |
          $output = "build/update-channel/${{ inputs.target_channel }}.json"
          New-Item -ItemType Directory -Force build/update-channel | Out-Null
          $signature = (Get-Content '${{ steps.assets.outputs.signature_path }}' -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) { throw 'The published updater signature was empty.' }
          $artifactSpec = "windows=tauri-updater,${{ steps.assets.outputs.installer_url }},${{ steps.assets.outputs.installer_path }},$signature"
          $arguments = @(
            'scripts/promote_update_channel_manifest.py',
            '--source', '${{ steps.source.outputs.manifest_path }}',
            '--target-channel', '${{ inputs.target_channel }}',
            '--target-version', '${{ steps.identity.outputs.version }}',
            '--artifact', $artifactSpec,
            '--output', $output
          )
          if (-not [string]::IsNullOrWhiteSpace('${{ inputs.release_notes_url }}')) {
            $arguments += @('--release-notes-url', '${{ inputs.release_notes_url }}')
          }
          python @arguments
          Get-Content $output

      - name: Advance target rolling channel pointers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_DIR: ${{ steps.assets.outputs.published_dir }}
        run: |
          $target = '${{ inputs.target_channel }}'
          $desktopTag = "desktop-$target"
          gh release view $desktopTag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $desktopTag --repo $env:GITHUB_REPOSITORY --target '${{ steps.source.outputs.commit_sha }}' --title "InfoMancer Desktop $target Update Channel" --notes "Rolling signed Tauri updater manifest for qualified InfoMancer $target builds." --prerelease
          }
          gh release upload $desktopTag --repo $env:GITHUB_REPOSITORY (Join-Path $env:PUBLISHED_DIR 'latest.json') --clobber

          gh release view update-channels --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create update-channels --repo $env:GITHUB_REPOSITORY --target '${{ steps.source.outputs.commit_sha }}' --title 'InfoMancer Qualified Update Channels' --notes 'Rolling channel manifests for qualified InfoMancer builds.' --prerelease
          }
          gh release upload update-channels --repo $env:GITHUB_REPOSITORY "build/update-channel/$target.json" --clobber
