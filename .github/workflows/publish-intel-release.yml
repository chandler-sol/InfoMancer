name: Publish Intel Beta to Releases

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/**'
    paths:
      - .github/workflows/publish-intel-release.yml
      - .github/workflows/macos-intel-priority.yml
      - desktop/**
      - app/**
      - scripts/stage_ffprobe.py
      - scripts/verify_macos_minos.py
      - requirements.txt

permissions:
  actions: read
  contents: write

jobs:
  publish-intel:
    name: Publish latest Intel DMG
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Wait for matching Intel fast-track build
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for _ in {1..120}; do
            row="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow macos-intel-priority.yml \
              --branch "$GITHUB_REF_NAME" \
              --limit 20 \
              --json databaseId,headSha,status,conclusion \
              --jq ".[] | select(.headSha == \"$GITHUB_SHA\") | [.databaseId,.status,.conclusion] | @tsv" \
              | head -n 1)"
            if [ -n "$row" ]; then
              IFS=$'\t' read -r candidate_id candidate_status candidate_conclusion <<< "$row"
              echo "Intel run $candidate_id: $candidate_status ${candidate_conclusion:-}"
              if [ "$candidate_status" = "completed" ]; then
                if [ "$candidate_conclusion" != "success" ]; then
                  echo "Intel fast-track build failed with conclusion $candidate_conclusion." >&2
                  exit 1
                fi
                run_id="$candidate_id"
                break
              fi
            else
              echo "Waiting for Intel fast-track run for $GITHUB_SHA..."
            fi
            sleep 15
          done

          if [ -z "$run_id" ]; then
            echo "Timed out waiting for a successful Intel build for $GITHUB_SHA." >&2
            exit 1
          fi

          echo "INTEL_RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Download matching Intel artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "$INTEL_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name infomancer-macos-intel-priority \
            --dir release-assets

      - name: Create or refresh draft beta release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#release/}"
          TAG="v$VERSION"
          TITLE="InfoMancer $VERSION"
          dmg="$(find release-assets -type f -name '*.dmg' -print -quit)"
          if [ -z "$dmg" ]; then
            echo 'Intel DMG was not found in the downloaded artifact.' >&2
            find release-assets -maxdepth 3 -type f -print >&2 || true
            exit 1
          fi

          publish_dir="$RUNNER_TEMP/infomancer-intel-release"
          mkdir -p "$publish_dir"
          asset="$publish_dir/InfoMancer-$VERSION-macOS-Intel.dmg"
          cp "$dmg" "$asset"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            if [ "$is_draft" != "true" ]; then
              echo "Release $TAG is already published; refusing to replace it." >&2
              exit 1
            fi
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --draft \
              --prerelease
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "Intel macOS fast-track beta build. Additional platform assets can be added as their packaging completes." \
              --draft \
              --prerelease
          fi

          gh release upload "$TAG" "$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          echo "Uploaded $(basename "$asset") to draft release $TAG."
