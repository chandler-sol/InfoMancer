name: Refresh published Beta 2 release

on:
  push:
    branches:
      - release/0.8.1-beta.2
    paths:
      - .github/workflows/refresh-beta2-release.yml

permissions:
  actions: read
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_RUN_ID: 34514296306
      RELEASE_SHA: 46e29e932ff0051b7cc10a75044df4847283b9b6
      TAG: v0.8.1-beta.2
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Download validated Beta 2 artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-assets

      - name: Flatten assets and generate checksums
        shell: bash
        run: |
          mkdir -p publish
          find release-assets -type f -print0 | while IFS= read -r -d '' asset; do
            cp "$asset" "publish/$(basename "$asset")"
          done
          find publish -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  publish/#  #' > publish/SHA256SUMS.txt
          cat publish/SHA256SUMS.txt

      - name: Refresh published Beta 2 in place
        shell: bash
        run: |
          gh release view "$TAG" >/dev/null
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
            -f sha="$RELEASE_SHA" \
            -F force=true >/dev/null
          gh release edit "$TAG" \
            --title 'InfoMancer 0.8.1-beta.2' \
            --notes-file docs/releases/0.8.1-beta.2.md \
            --prerelease
          gh release upload "$TAG" publish/* --clobber
          echo "Refreshed $TAG from validated build run $SOURCE_RUN_ID at $RELEASE_SHA."
