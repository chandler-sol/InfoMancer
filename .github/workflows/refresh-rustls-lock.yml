name: Refresh Rustls Lockfile

on:
  push:
    branches:
      - audit/0.9-cycle-0d
    paths:
      - .github/workflows/refresh-rustls-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'chandler-sol/InfoMancer' && github.actor == 'chandler-sol'
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/0.9-cycle-0d

      - name: Resolve fixed Rustls release
        run: cargo update --manifest-path desktop/src-tauri/Cargo.toml -p rustls --precise 0.23.45

      - name: Verify resolved Rustls version
        shell: python
        run: |
          from pathlib import Path
          import re
          lock = Path('desktop/src-tauri/Cargo.lock').read_text(encoding='utf-8')
          match = re.search(r'\[\[package\]\]\nname = "rustls"\nversion = "([^"]+)"', lock)
          if not match or match.group(1) != '0.23.45':
              raise SystemExit(f'Expected rustls 0.23.45, found {match.group(1) if match else "missing"}')

      - name: Commit Cargo-generated lockfile only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- desktop/src-tauri/Cargo.lock; then
            echo 'Cargo.lock already resolves rustls 0.23.45.'
            exit 0
          fi
          unexpected="$(git diff --name-only | grep -v '^desktop/src-tauri/Cargo.lock$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:"
            echo "$unexpected"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/src-tauri/Cargo.lock
          git commit -m 'Update rustls for RUSTSEC-2026-0285'
          git push origin HEAD:audit/0.9-cycle-0d
