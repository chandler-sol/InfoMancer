name: Inspect stale 0.8 alpha branch references

on:
  push:
    branches:
      - release/0.8.1-beta.1
    paths:
      - .github/workflows/rename-08-testing-beta.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List stale branch references
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          old='testing/0.8-'
          old="${old}alpha"
          for branch in testing/0.8-beta release/0.8.1-beta.1; do
            echo "=== $branch ==="
            git checkout -B "$branch" "origin/$branch" >/dev/null 2>&1
            grep -RIl --exclude-dir=.git --exclude=rename-08-testing-beta.yml -- "$old" . || true
          done
