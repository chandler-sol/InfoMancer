name: Retire old 0.8 alpha testing branch

on:
  push:
    branches:
      - release/0.8.1-beta.1
    paths:
      - .github/workflows/rename-08-testing-beta.yml

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete old testing branch
        shell: bash
        run: |
          set -euo pipefail
          old='testing/0.8-'
          old="${old}alpha"
          git push origin --delete "$old"
