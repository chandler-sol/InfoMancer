name: One-shot Cargo Lock Sync

on:
  push:
    branches:
      - task/ffprobe-lgpl-compliance
    paths:
      - .github/workflows/sync-cargo-lock.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: windows-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: task/ffprobe-lgpl-compliance
          persist-credentials: true

      - name: Update lockfile through Cargo
        shell: pwsh
        run: |
          Copy-Item desktop/src-tauri/Cargo.lock "$env:RUNNER_TEMP\Cargo.lock.before"
          cargo check --manifest-path desktop/src-tauri/Cargo.toml
          $cargoExit = $LASTEXITCODE
          if ($cargoExit -ne 0) {
            Write-Host "Cargo check stopped after lock resolution with exit code $cargoExit; the exact lockfile diff is validated in the next step."
          }
          exit 0

      - name: Verify Cargo changed only expected root metadata
        shell: pwsh
        run: |
          $env:LOCK_BEFORE = "$env:RUNNER_TEMP\Cargo.lock.before"
          $env:LOCK_AFTER = (Resolve-Path 'desktop/src-tauri/Cargo.lock').Path
          @'
          import os
          from pathlib import Path

          before = Path(os.environ['LOCK_BEFORE']).read_text(encoding='utf-8')
          after = Path(os.environ['LOCK_AFTER']).read_text(encoding='utf-8')
          expected = before.replace(
              'name = "infomancer-desktop"\nversion = "0.8.1-beta.1"',
              'name = "infomancer-desktop"\nversion = "0.8.1-beta.2"',
              1,
          )
          expected = expected.replace(
              'dependencies = [\n "serde",\n "tauri",',
              'dependencies = [\n "serde",\n "serde_json",\n "tauri",',
              1,
          )
          if after != expected:
              raise SystemExit('Cargo.lock changed beyond the two expected root-package updates; refusing to commit it.')
          '@ | python -

      - name: Commit generated lockfile
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src-tauri/Cargo.lock
          git diff --cached --exit-code && throw 'Cargo did not update the stale lockfile.'
          git commit -m "Sync Rust lockfile with beta.2 manifest"
          git push origin HEAD:task/ffprobe-lgpl-compliance
