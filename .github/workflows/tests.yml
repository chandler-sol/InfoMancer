name: Tests

on:
  push:
    branches:
      - main
      - testing/0.8-alpha
      - testing/0.9-alpha
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    name: Security and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt

      - name: Scan Python security patterns
        run: |
          python -m pip install bandit==1.9.4
          # B608 flags InfoMancer's parameterized placeholder/allowlist SQL assembly;
          # B310 flags fixed HTTPS provider URLs and the loopback updater health URL.
          # Both classes were manually reviewed during the 0.8 alpha security pass.
          bandit -r app scripts desktop -x app/templates,app/static,desktop/ui -ll -ii -s B608,B310

      - name: Verify Rust lockfile is synchronized
        run: cargo metadata --manifest-path desktop/src-tauri/Cargo.toml --locked --format-version 1 --no-deps > /dev/null

      - name: Audit Rust desktop dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file desktop/src-tauri/Cargo.lock

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt

      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-output-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Compile application
        run: python -m compileall -q app

  acceptance:
    name: Browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install InfoMancer dependencies
        run: python -m pip install -r requirements.txt

      - name: Install and audit Playwright
        working-directory: e2e
        run: |
          npm install --ignore-scripts
          npm audit --audit-level=high
          # GitHub's hosted image already carries Chromium runtime libraries. Avoid
          # --with-deps here because it mutates runner apt sources and can fail on an
          # unrelated third-party repository before Playwright is even installed.
          npx playwright install chromium

      - name: Run isolated browser acceptance suite
        working-directory: e2e
        run: npm test

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-acceptance-evidence
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/.e2e-runtime/logs
          if-no-files-found: warn
          retention-days: 14

  qualified-dev-candidate:
    name: Qualified Dev candidate metadata
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/testing/0.9-alpha'
    needs:
      - audit
      - test
      - acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact qualified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Build qualified Dev candidate manifest
        shell: bash
        env:
          QUALIFIED_SHA: ${{ github.sha }}
          QUALIFICATION_RUN_ID: ${{ github.run_id }}
          QUALIFICATION_RUN_NUMBER: ${{ github.run_number }}
          QUALIFICATION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          SHORT_SHA="${QUALIFIED_SHA:0:8}"
          VERSION="0.9.0-dev.${QUALIFICATION_RUN_NUMBER}"
          BUILD_ID="dev-${QUALIFICATION_RUN_NUMBER}-${SHORT_SHA}"
          python scripts/build_update_channel_manifest.py \
            --channel dev \
            --version "$VERSION" \
            --build-id "$BUILD_ID" \
            --commit-sha "$QUALIFIED_SHA" \
            --workflow Tests \
            --run-id "$QUALIFICATION_RUN_ID" \
            --run-url "$QUALIFICATION_RUN_URL" \
            --output build/update-channel/dev-candidate.json
          cat build/update-channel/dev-candidate.json

      - name: Preserve qualified candidate manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-channel-candidate-${{ github.run_number }}-${{ github.sha }}
          path: build/update-channel/dev-candidate.json
          if-no-files-found: error
          retention-days: 30

  windows-dev-package:
    name: Signed Windows Dev package
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/testing/0.9-alpha'
    needs:
      - audit
      - test
      - acceptance
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Check out the exact qualified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check signing configuration
        id: signing
        shell: pwsh
        env:
          INFOMANCER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          INFOMANCER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:INFOMANCER_PUBLIC_KEY) -or [string]::IsNullOrWhiteSpace($env:INFOMANCER_PRIVATE_KEY)) {
            'configured=false' >> $env:GITHUB_OUTPUT
            Write-Host 'Signed Dev packaging is not configured. Qualification remains valid, but the Dev install channel will not advance.'
          } else {
            'configured=true' >> $env:GITHUB_OUTPUT
          }

      - name: Set up qualified build identity
        if: steps.signing.outputs.configured == 'true'
        id: identity
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 8)
          $version = "0.9.0-dev.${{ github.run_number }}"
          $buildId = "dev-${{ github.run_number }}-$shortSha"
          $tag = "desktop-dev-${{ github.run_number }}-$shortSha"
          "version=$version" >> $env:GITHUB_OUTPUT
          "build_id=$buildId" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        if: steps.signing.outputs.configured == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        if: steps.signing.outputs.configured == 'true'
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.21.0

      - name: Stamp immutable Dev version into build workspace
        if: steps.signing.outputs.configured == 'true'
        run: python scripts/stamp_build_version.py "${{ steps.identity.outputs.version }}"

      - name: Build bundled InfoMancer core
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --name infomancer-core \
            --onefile \
            --windowed \
            --collect-data certifi \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            --add-data "app/templates:app/templates" \
            --add-data "app/static:app/static" \
            --add-data "app/build-info.json:app" \
            --add-data "app/ffprobe-assets.json:app" \
            --distpath desktop/src-tauri/binaries \
            app/__main__.py
          if [ ! -f desktop/src-tauri/binaries/infomancer-core.exe ]; then
            echo 'PyInstaller did not produce infomancer-core.exe.' >&2
            exit 1
          fi
          cp desktop/src-tauri/binaries/infomancer-core.exe \
            desktop/src-tauri/binaries/infomancer-core-x86_64-pc-windows-msvc.exe

      - name: Bootstrap pinned FFprobe into bundle
        if: steps.signing.outputs.configured == 'true'
        shell: pwsh
        run: |
          python scripts/bootstrap_ffprobe.py `
            --target x86_64-pc-windows-msvc `
            --output desktop/src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ffprobe = (Resolve-Path 'desktop/src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe').Path
          $output = & $ffprobe -version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Packaged ffprobe failed self-check: $output" }
          if ($output -notmatch '^ffprobe version') { throw "Unexpected ffprobe self-check output: $output" }

      - name: Build signed desktop bundle
        if: steps.signing.outputs.configured == 'true'
        working-directory: desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          INFOMANCER_BUILD_COMMIT: ${{ github.sha }}
          INFOMANCER_BUILD_ID: ${{ steps.identity.outputs.build_id }}
        run: |
          npm ci
          npm run tauri:release -- --bundles nsis

      - name: Verify installed signed candidate
        if: steps.signing.outputs.configured == 'true'
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.identity.outputs.version }}
          EXPECTED_BUILD_ID: ${{ steps.identity.outputs.build_id }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'desktop/src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Signed NSIS installer was not found.' }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Installer Authenticode status was $($signature.Status), expected Valid."
          }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with code $($process.ExitCode)." }
          $installed = Join-Path $env:LOCALAPPDATA 'InfoMancer\InfoMancer.exe'
          if (-not (Test-Path $installed)) { throw "Installed InfoMancer executable was not found at $installed" }
          $installedSignature = Get-AuthenticodeSignature $installed
          if ($installedSignature.Status -ne 'Valid') {
            throw "Installed executable Authenticode status was $($installedSignature.Status), expected Valid."
          }
          $core = Join-Path $env:LOCALAPPDATA 'InfoMancer\infomancer-core-x86_64-pc-windows-msvc.exe'
          if (-not (Test-Path $core)) { throw "Installed InfoMancer core was not found at $core" }
          $coreSignature = Get-AuthenticodeSignature $core
          if ($coreSignature.Status -ne 'Valid') {
            throw "Installed core Authenticode status was $($coreSignature.Status), expected Valid."
          }
          $log = Join-Path $env:TEMP 'infomancer-qualified-core.log'
          $env:INFOMANCER_SANDBOX = '1'
          $env:INFOMANCER_BIND_HOST = '127.0.0.1'
          $env:INFOMANCER_PORT = '8787'
          $coreProcess = Start-Process -FilePath $core -PassThru -RedirectStandardOutput $log -RedirectStandardError $log
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              Start-Sleep -Milliseconds 500
              if ($coreProcess.HasExited) { break }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8787/health' -TimeoutSec 2
                if ($health.status -eq 'ok') { $healthy = $true; break }
              } catch {}
            }
            if (-not $healthy) {
              $detail = if (Test-Path $log) { Get-Content $log -Raw } else { 'No core log was written.' }
              throw "Installed core did not become healthy. $detail"
            }
            $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8787/health' -TimeoutSec 2
            if ($health.version -ne $env:EXPECTED_VERSION) {
              throw "Installed core reported version $($health.version), expected $env:EXPECTED_VERSION"
            }
            if ($health.build_id -ne $env:EXPECTED_BUILD_ID) {
              throw "Installed core reported build ID $($health.build_id), expected $env:EXPECTED_BUILD_ID"
            }
            if ($health.commit_sha -ne $env:EXPECTED_SHA) {
              throw "Installed core reported commit $($health.commit_sha), expected $env:EXPECTED_SHA"
            }
          } finally {
            if (-not $coreProcess.HasExited) { Stop-Process -Id $coreProcess.Id -Force }
          }

      - name: Locate signed updater artifacts
        if: steps.signing.outputs.configured == 'true'
        id: updater
        shell: pwsh
        run: |
          $archive = Get-ChildItem 'desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip' | Select-Object -First 1
          if (-not $archive) { throw 'Tauri updater archive was not produced.' }
          $signature = Get-Item "$($archive.FullName).sig"
          if (-not $signature) { throw 'Tauri updater signature was not produced.' }
          "archive=$($archive.FullName)" >> $env:GITHUB_OUTPUT
          "signature=$($signature.FullName)" >> $env:GITHUB_OUTPUT
          "archive_name=$($archive.Name)" >> $env:GITHUB_OUTPUT
          "signature_name=$($signature.Name)" >> $env:GITHUB_OUTPUT

      - name: Verify updater signature before publication
        if: steps.signing.outputs.configured == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          ARCHIVE_PATH: ${{ steps.updater.outputs.archive }}
          SIGNATURE_PATH: ${{ steps.updater.outputs.signature }}
        run: |
          $ErrorActionPreference = 'Stop'
          $publicKey = $env:TAURI_SIGNING_PUBLIC_KEY
          if ([string]::IsNullOrWhiteSpace($publicKey)) { throw 'TAURI_UPDATER_PUBLIC_KEY is not configured.' }
          $signature = (Get-Content -Raw $env:SIGNATURE_PATH).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) { throw 'Updater signature file is empty.' }
          $minisign = Join-Path $env:RUNNER_TEMP 'minisign.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip' -OutFile "$minisign.zip"
          Expand-Archive -Path "$minisign.zip" -DestinationPath "$minisign-unpack"
          $found = Get-ChildItem "$minisign-unpack" -Recurse -Filter minisign.exe | Select-Object -First 1
          if (-not $found) { throw 'minisign.exe was not found in the downloaded archive.' }
          Copy-Item $found.FullName $minisign
          Set-Content -Path "$env:SIGNATURE_PATH.minisig" -Value $signature -NoNewline
          & $minisign -Vm $env:ARCHIVE_PATH -x "$env:SIGNATURE_PATH.minisig" -P $publicKey
          if ($LASTEXITCODE -ne 0) { throw 'Updater signature verification failed.' }

      - name: Rename native artifacts for humans
        if: steps.signing.outputs.configured == 'true'
        shell: pwsh
        env:
          CHANNEL: dev
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          python scripts/rename_release_assets.py `
            --platform windows `
            --channel $env:CHANNEL `
            --version $env:VERSION `
            --directory desktop/src-tauri/target/release/bundle/nsis

      - name: Build signed Dev update manifest
        if: steps.signing.outputs.configured == 'true'
        shell: pwsh
        env:
          CHANNEL: dev
          VERSION: ${{ steps.identity.outputs.version }}
          BUILD_ID: ${{ steps.identity.outputs.build_id }}
          TAG: ${{ steps.identity.outputs.tag }}
          SHORT_SHA: ${{ steps.identity.outputs.short_sha }}
          ARCHIVE_NAME: ${{ steps.updater.outputs.archive_name }}
          SIGNATURE_NAME: ${{ steps.updater.outputs.signature_name }}
        run: |
          $archivePath = "desktop/src-tauri/target/release/bundle/nsis/$env:ARCHIVE_NAME"
          $signaturePath = "desktop/src-tauri/target/release/bundle/nsis/$env:SIGNATURE_NAME"
          $installer = Get-ChildItem 'desktop/src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Renamed NSIS installer was not found.' }
          $archiveUrl = "${{ github.server_url }}/${{ github.repository }}/releases/download/$env:TAG/$env:ARCHIVE_NAME"
          $signature = (Get-Content -Raw $signaturePath).Trim()
          python scripts/build_update_channel_manifest.py `
            --channel $env:CHANNEL `
            --version $env:VERSION `
            --build-id $env:BUILD_ID `
            --commit-sha "${{ github.sha }}" `
            --workflow Tests `
            --run-id "${{ github.run_id }}" `
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" `
            --artifact "windows-x86_64=$archiveUrl=$archivePath=$signature" `
            --artifact-digest-source "windows-installer=$($installer.FullName)" `
            --output build/update-channel/dev.json

      - name: Publish signed Dev release
        if: steps.signing.outputs.configured == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          gh release create $env:TAG `
            --target "${{ github.sha }}" `
            --title "InfoMancer ${{ steps.identity.outputs.version }}" `
            --notes "Qualified Dev build from Tests run ${{ github.run_number }}. Commit ${{ github.sha }}." `
            --prerelease `
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe `
            desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip `
            desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip.sig `
            build/update-channel/dev.json#dev.json
