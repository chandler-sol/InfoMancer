name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    name: Security and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt

      - name: Scan Python security patterns
        run: |
          python -m pip install bandit==1.9.4
          # B608 flags InfoMancer's parameterized placeholder/allowlist SQL assembly;
          # B310 flags fixed HTTPS provider URLs and the loopback updater health URL.
          # Both classes were manually reviewed during the 0.8 alpha security pass.
          bandit -r app scripts desktop -x app/templates,app/static,desktop/ui -ll -ii -s B608,B310

      - name: Audit Rust desktop dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file desktop/src-tauri/Cargo.lock

      - name: Preserve audit source snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-source-snapshot
          path: |
            app
            tests
            scripts
            desktop
            requirements.txt
            README.md
            SECURITY.md
          if-no-files-found: error
          retention-days: 1

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt

      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-output-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Compile application
        run: python -m compileall -q app
