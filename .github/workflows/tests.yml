name: Tests

on:
  push:
    branches:
      - main
      - testing/0.8-alpha
      - testing/0.9-alpha
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    name: Security and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt
          python -m pip_audit -r requirements-ocr.txt

      - name: Scan Python security patterns
        run: |
          python -m pip install bandit==1.9.4
          # B608 flags InfoMancer's parameterized placeholder/allowlist SQL assembly;
          # B310 flags fixed HTTPS provider URLs and the loopback updater health URL.
          # Both classes were manually reviewed during the 0.8 alpha security pass.
          bandit -r app scripts desktop -x app/templates,app/static,desktop/ui -ll -ii -s B608,B310

      - name: Verify Rust lockfile is synchronized
        run: cargo metadata --manifest-path desktop/src-tauri/Cargo.toml --locked --format-version 1 --no-deps > /dev/null

      - name: Audit Rust desktop dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file desktop/src-tauri/Cargo.lock

  ocr-smoke:
    name: Optional CPU OCR smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install base and optional OCR dependencies
        run: python -m pip install -r requirements.txt -r requirements-ocr.txt

      - name: Initialize and exercise real CPU OCR adapter
        shell: bash
        run: |
          python - <<'PY'
          from io import BytesIO
          from PIL import Image, ImageDraw
          from app.media_identity.ocr import RapidOcrCpuEngine

          image = Image.new("RGB", (320, 120), "white")
          ImageDraw.Draw(image).text((20, 40), "INFOMANCER OCR TEST", fill="black")
          payload = BytesIO()
          image.save(payload, format="JPEG", quality=90)

          engine = RapidOcrCpuEngine()
          assert engine.available(), "Pinned RapidOCR/ONNX Runtime stack is unavailable"
          identity = engine.cache_identity()
          assert identity["backend"] == "onnxruntime-cpu"
          result = engine.recognize(payload.getvalue())
          assert isinstance(result.text, str)
          assert result.confidence is None or 0.0 <= result.confidence <= 1.0
          print(identity)
          print({"text": result.text, "confidence": result.confidence})
          PY

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt

      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-output-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Compile application
        run: python -m compileall -q app

  desktop-rust-test:
    name: Rust desktop tests on Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install packaging dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.21.0

      - name: Generate native test icons
        working-directory: desktop
        run: |
          npm ci
          npm run icon

      - name: Build and self-check real Windows sidecar
        run: python scripts/build_windows_sidecar.py

      - name: Run Rust desktop tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked

  acceptance:
    name: Browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install InfoMancer dependencies
        run: python -m pip install -r requirements.txt

      - name: Install and audit Playwright
        working-directory: e2e
        run: |
          npm ci --ignore-scripts
          # npm's registry can currently return a malformed Bulk Advisory response
          # and then reject the retiring Quick Audit fallback. Keep npm audit as the
          # primary check, but fail closed through our lockfile-based Bulk endpoint
          # reader when the CLI cannot complete the audit.
          npm audit --audit-level=high || python ../scripts/audit_npm_lock.py package-lock.json --audit-level high
          # GitHub's hosted image already carries Chromium runtime libraries. Avoid
          # --with-deps here because it mutates runner apt sources and can fail on an
          # unrelated third-party repository before Playwright is even installed.
          npx playwright install chromium

      - name: Run isolated browser acceptance suite
        working-directory: e2e
        run: npm test

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-acceptance-evidence
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/.e2e-runtime/logs
          if-no-files-found: warn
          retention-days: 14

  qualified-dev-candidate:
    name: Qualified Dev candidate metadata
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/testing/0.9-alpha'
    needs:
      - audit
      - ocr-smoke
      - test
      - desktop-rust-test
      - acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact qualified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Build qualified Dev candidate manifest
        shell: bash
        env:
          QUALIFIED_SHA: ${{ github.sha }}
          QUALIFICATION_RUN_ID: ${{ github.run_id }}
          QUALIFICATION_RUN_NUMBER: ${{ github.run_number }}
          QUALIFICATION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          SHORT_SHA="${QUALIFIED_SHA:0:8}"
          VERSION="0.9.0-dev.${QUALIFICATION_RUN_NUMBER}"
          BUILD_ID="dev-${QUALIFICATION_RUN_NUMBER}-${SHORT_SHA}"
          python scripts/build_update_channel_manifest.py \
            --channel dev \
            --version "$VERSION" \
            --build-id "$BUILD_ID" \
            --commit-sha "$QUALIFIED_SHA" \
            --workflow Tests \
            --run-id "$QUALIFICATION_RUN_ID" \
            --run-url "$QUALIFICATION_RUN_URL" \
            --output build/update-channel/dev-candidate.json
          cat build/update-channel/dev-candidate.json

      - name: Preserve qualified candidate manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-channel-candidate-${{ github.run_number }}-${{ github.sha }}
          path: build/update-channel/dev-candidate.json
          if-no-files-found: error
          retention-days: 30

  windows-dev-package:
    name: Signed Windows Dev package
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/testing/0.9-alpha'
    needs:
      - audit
      - ocr-smoke
      - test
      - desktop-rust-test
      - acceptance
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Check out the exact qualified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check signing configuration
        id: signing
        shell: pwsh
        env:
          INFOMANCER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          INFOMANCER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:INFOMANCER_PUBLIC_KEY) -or [string]::IsNullOrWhiteSpace($env:INFOMANCER_PRIVATE_KEY)) {
            'configured=false' >> $env:GITHUB_OUTPUT
            Write-Host 'Signed Dev packaging is not configured. Qualification remains valid, but the Dev install channel will not advance.'
          } else {
            'configured=true' >> $env:GITHUB_OUTPUT
          }

      - name: Set up qualified build identity
        if: steps.signing.outputs.configured == 'true'
        id: identity
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 8)
          $version = "0.9.0-dev.${{ github.run_number }}"
          $buildId = "dev-${{ github.run_number }}-$shortSha"
          $tag = "desktop-dev-${{ github.run_number }}-$shortSha"
          "version=$version" >> $env:GITHUB_OUTPUT
          "build_id=$buildId" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        if: steps.signing.outputs.configured == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        if: steps.signing.outputs.configured == 'true'
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.21.0

      - name: Stamp immutable Dev version into build workspace
        if: steps.signing.outputs.configured == 'true'
        run: python scripts/stamp_build_version.py "${{ steps.identity.outputs.version }}"

      - name: Build and self-check bundled InfoMancer core
        if: steps.signing.outputs.configured == 'true'
        run: python scripts/build_windows_sidecar.py

      - name: Install and audit desktop dependencies
        if: steps.signing.outputs.configured == 'true'
        working-directory: desktop
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Generate native icons
        if: steps.signing.outputs.configured == 'true'
        working-directory: desktop
        run: npm run icon

      - name: Verify stamped packaging versions
        if: steps.signing.outputs.configured == 'true'
        run: python -m unittest tests.test_windows_desktop -v

      - name: Build, sign, and publish immutable Windows Dev updater
        if: steps.signing.outputs.configured == 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          INFOMANCER_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          INFOMANCER_BUILD_COMMIT: ${{ github.sha }}
          INFOMANCER_BUILD_ID: ${{ steps.identity.outputs.build_id }}
        with:
          projectPath: desktop
          tagName: ${{ steps.identity.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseName: InfoMancer ${{ steps.identity.outputs.version }}
          releaseBody: Qualified InfoMancer Dev build from Tests run ${{ github.run_number }} at commit ${{ github.sha }}.
          releaseDraft: false
          prerelease: true
          args: --bundles nsis --config src-tauri/tauri.release.conf.json
          updaterJsonPreferNsis: true
          includeUpdaterJson: true

      - name: Resolve and verify published updater assets
        if: steps.signing.outputs.configured == 'true'
        id: assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEV_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $published = Join-Path $env:RUNNER_TEMP 'published-dev'
          New-Item -ItemType Directory -Force $published | Out-Null
          gh release download $env:DEV_TAG --pattern latest.json --dir $published
          $release = gh release view $env:DEV_TAG --json assets | ConvertFrom-Json
          $installer = $release.assets | Where-Object { $_.name -like '*.exe' -and $_.name -notlike '*.sig' } | Select-Object -First 1
          if ($null -eq $installer) { throw 'The signed Dev release did not contain a Windows installer asset.' }
          $signatureName = "$($installer.name).sig"
          $signatureAsset = $release.assets | Where-Object { $_.name -eq $signatureName } | Select-Object -First 1
          if ($null -eq $signatureAsset) { throw 'The signed Dev release did not contain the matching updater signature.' }
          gh release download $env:DEV_TAG --pattern $installer.name --dir $published
          gh release download $env:DEV_TAG --pattern $signatureAsset.name --dir $published
          $installerPath = Join-Path $published $installer.name
          $signaturePath = Join-Path $published $signatureAsset.name
          $latestPath = Join-Path $published 'latest.json'
          $latest = Get-Content $latestPath -Raw | ConvertFrom-Json
          $platform = $latest.platforms.PSObject.Properties | Where-Object { $_.Name -like 'windows-*' } | Select-Object -First 1
          if ($null -eq $platform) { throw 'The immutable Dev latest.json has no Windows updater platform.' }
          $publishedSignature = (Get-Content $signaturePath -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($publishedSignature) -or ([string]$platform.Value.signature).Trim() -ne $publishedSignature) {
            throw 'The immutable Dev latest.json signature does not match the published updater signature.'
          }
          $expectedPrefix = "https://github.com/${{ github.repository }}/releases/download/$env:DEV_TAG/"
          if (-not ([string]$platform.Value.url).StartsWith($expectedPrefix)) {
            throw 'The immutable Dev latest.json does not point at its immutable qualified release.'
          }
          "published_dir=$published" >> $env:GITHUB_OUTPUT
          "installer_path=$installerPath" >> $env:GITHUB_OUTPUT
          "installer_url=$($installer.url)" >> $env:GITHUB_OUTPUT
          "signature_path=$signaturePath" >> $env:GITHUB_OUTPUT

      - name: Build installable Dev channel manifest
        if: steps.signing.outputs.configured == 'true'
        shell: pwsh
        env:
          QUALIFICATION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          New-Item -ItemType Directory -Force build/update-channel | Out-Null
          $signature = (Get-Content '${{ steps.assets.outputs.signature_path }}' -Raw).Trim()
          $artifactSpec = "windows=tauri-updater,${{ steps.assets.outputs.installer_url }},${{ steps.assets.outputs.installer_path }},$signature"
          python scripts/build_update_channel_manifest.py `
            --channel dev `
            --version "${{ steps.identity.outputs.version }}" `
            --build-id "${{ steps.identity.outputs.build_id }}" `
            --commit-sha "$env:GITHUB_SHA" `
            --workflow Tests `
            --run-id "${{ github.run_id }}" `
            --run-url "$env:QUALIFICATION_RUN_URL" `
            --artifact $artifactSpec `
            --output build/update-channel/dev.json
          Get-Content build/update-channel/dev.json

      - name: Advance rolling Desktop Dev and qualified channel manifests
        if: steps.signing.outputs.configured == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_DIR: ${{ steps.assets.outputs.published_dir }}
        run: |
          gh release view desktop-dev --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create desktop-dev --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'InfoMancer Desktop Dev Update Channel' --notes 'Rolling signed Tauri updater manifest. Only qualified 0.9 development builds advance this pointer.' --prerelease
          }
          gh release upload desktop-dev --repo $env:GITHUB_REPOSITORY (Join-Path $env:PUBLISHED_DIR 'latest.json') --clobber

          gh release view update-channels --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create update-channels --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'InfoMancer Qualified Update Channels' --notes 'Rolling channel manifests for qualified InfoMancer builds.' --prerelease
          }
          gh release upload update-channels --repo $env:GITHUB_REPOSITORY build/update-channel/dev.json --clobber
