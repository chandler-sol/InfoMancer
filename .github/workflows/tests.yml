name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    name: Security and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt

      - name: Scan Python security patterns
        run: |
          python -m pip install bandit==1.9.4
          # B608 flags InfoMancer's parameterized placeholder/allowlist SQL assembly;
          # B310 flags fixed HTTPS provider URLs and the loopback updater health URL.
          # Both classes were manually reviewed during the 0.8 alpha security pass.
          bandit -r app scripts desktop -x app/templates,app/static,desktop/ui -ll -ii -s B608,B310

      - name: Audit Rust desktop dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file desktop/src-tauri/Cargo.lock

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt

      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-output-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Compile application
        run: python -m compileall -q app

  acceptance:
    name: Browser acceptance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INFOMANCER_E2E_BOOTSTRAP_TOKEN: e2e-library-card-123456
    steps:
      - name: Check out pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Prepare acceptance paths
        shell: bash
        run: |
          echo "E2E_ROOT=$RUNNER_TEMP/infomancer-e2e" >> "$GITHUB_ENV"
          echo "INFOMANCER_E2E_DATABASE=$RUNNER_TEMP/infomancer-e2e/state/sandbox.db" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install InfoMancer dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Build deterministic media fixtures
        run: |
          export INFOMANCER_E2E_ROOT="$E2E_ROOT"
          python e2e/create_fixtures.py

      - name: Start isolated InfoMancer acceptance servers
        shell: bash
        run: |
          set -euo pipefail
          MEDIA_ROOT="$E2E_ROOT/media/Movies"
          TOKEN_DB="$E2E_ROOT/state/token.db"
          SANDBOX_DB="$E2E_ROOT/state/sandbox.db"
          SECRET="0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

          INFOMANCER_DATABASE="$TOKEN_DB" \
          INFOMANCER_BOOTSTRAP_TOKEN="$INFOMANCER_E2E_BOOTSTRAP_TOKEN" \
          INFOMANCER_SECRET="$SECRET" \
          MEDIA_BROWSE_ROOTS="$MEDIA_ROOT" \
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8787 \
            >"$E2E_ROOT/logs/token-server.log" 2>&1 &
          echo $! > "$E2E_ROOT/token-server.pid"

          INFOMANCER_DATABASE="$SANDBOX_DB" \
          INFOMANCER_SANDBOX=1 \
          INFOMANCER_SECRET="$SECRET" \
          MEDIA_BROWSE_ROOTS="$MEDIA_ROOT" \
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8788 \
            >"$E2E_ROOT/logs/sandbox-server.log" 2>&1 &
          echo $! > "$E2E_ROOT/sandbox-server.pid"

          python - <<'PY'
          import time
          import urllib.request

          for port in (8787, 8788):
              url = f"http://127.0.0.1:{port}/health"
              deadline = time.monotonic() + 30
              while time.monotonic() < deadline:
                  try:
                      with urllib.request.urlopen(url, timeout=2) as response:
                          if response.status == 200:
                              print(f"Ready: {url}")
                              break
                  except Exception:
                      time.sleep(0.25)
              else:
                  raise SystemExit(f"InfoMancer acceptance server never became ready: {url}")
          PY

      - name: Run browser acceptance suite
        working-directory: e2e
        env:
          INFOMANCER_E2E_TOKEN_URL: http://127.0.0.1:8787
          INFOMANCER_E2E_SANDBOX_URL: http://127.0.0.1:8788
        run: npm test

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-acceptance-evidence
          path: |
            e2e/playwright-report
            e2e/test-results
            ${{ env.E2E_ROOT }}/logs
          if-no-files-found: warn
          retention-days: 14

      - name: Stop acceptance servers
        if: always()
        shell: bash
        run: |
          for pid_file in "$E2E_ROOT"/*-server.pid; do
            [ -f "$pid_file" ] || continue
            kill "$(cat "$pid_file")" 2>/dev/null || true
          done
