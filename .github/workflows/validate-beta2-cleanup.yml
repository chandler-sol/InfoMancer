name: Validate Beta 2 Cleanup

on:
  push:
    branches:
      - release/0.8.1-beta.2
    paths:
      - .github/workflows/validate-beta2-cleanup.yml

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - name: Run Beta 2 desktop cleanup contracts
        run: python -m unittest tests.test_beta2_desktop_cleanup -v
