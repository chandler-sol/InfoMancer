name: Validate Beta 2 Full Tests

on:
  push:
    branches:
      - release/0.8.1-beta.2
    paths:
      - .github/workflows/validate-beta2-full-tests.yml

permissions:
  contents: read

jobs:
  full-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current Beta 2 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Run complete unit test suite
        run: python -m unittest discover -s tests -v
      # Final Beta 2 validation after removing the one-shot version alignment workflow.
