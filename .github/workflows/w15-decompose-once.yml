name: Apply W1.5 route decomposition once

on:
  push:
    branches:
      - workspace/0.8-foundation
    paths:
      - scripts/w15_extract_routes.py
      - scripts/w15_fix_transformer.py
      - .github/workflows/w15-decompose-once.yml

permissions:
  contents: write

jobs:
  decompose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out workspace branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: workspace/0.8-foundation
          fetch-depth: 0
          persist-credentials: false

      - name: Install application dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Apply final transformer compatibility patch
        run: python3 scripts/w15_fix_transformer.py

      - name: Apply W1.5 decomposition
        run: python3 scripts/w15_extract_routes.py

      - name: Run full test suite
        run: python3 -m unittest discover -s tests -v

      - name: Compile application
        run: python3 -m compileall app

      - name: Commit clean W1.5 tree
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f .github/workflows/w15-decompose-once.yml
          rm -f .github/workflows/w15-route-inventory-once.yml
          rm -f scripts/w15_extract_routes.py scripts/w15_route_inventory.py scripts/w15_fix_transformer.py
          git config user.name "arsenik"
          git config user.email "64607629+chandler-sol@users.noreply.github.com"
          git add -A
          git commit -m "Decompose application routes for Workspace W1.5"
          BASIC="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $BASIC" push origin HEAD:workspace/0.8-foundation
