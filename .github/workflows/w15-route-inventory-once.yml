name: W1.5 route inventory once

on:
  push:
    branches:
      - workspace/0.8-foundation
    paths:
      - scripts/w15_route_inventory.py
      - .github/workflows/w15-route-inventory-once.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out workspace branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: workspace/0.8-foundation
          persist-credentials: false
      - name: Inventory main.py routes
        run: python3 scripts/w15_route_inventory.py
