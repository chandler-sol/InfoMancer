name: Windows Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - testing/0.8-alpha
      - testing/0.9-alpha
    paths:
      - desktop/**
      - app/**
      - requirements.txt
      - .github/workflows/windows-desktop.yml

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.21.0

      - name: Run application tests
        run: python -m unittest discover -s tests -v

      - name: Build bundled InfoMancer core
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name infomancer-core --add-data "app/templates;app/templates" --add-data "app/static;app/static" desktop/sidecar.py
          $triple = (rustc --print host-tuple).Trim()
          New-Item -ItemType Directory -Force desktop/src-tauri/binaries | Out-Null
          Copy-Item dist/infomancer-core.exe "desktop/src-tauri/binaries/infomancer-core-$triple.exe"

      - name: Smoke-test recovery helper
        shell: pwsh
        run: |
          $tempRoot = Join-Path $env:RUNNER_TEMP 'infomancer-recovery-smoke'
          $dataDir = Join-Path $tempRoot 'data'
          $artDir = Join-Path $dataDir 'collection_artwork'
          New-Item -ItemType Directory -Force $artDir | Out-Null
          python -c "import sqlite3, pathlib; p=pathlib.Path(r'$dataDir')/'infomancer.db'; c=sqlite3.connect(p); c.execute('CREATE TABLE users(id INTEGER PRIMARY KEY)'); c.commit(); c.close()"
          Set-Content -Path (Join-Path $artDir 'smoke.png') -Value 'artwork'
          $backup = Join-Path $tempRoot 'smoke.infomancer-backup'
          & dist/infomancer-core.exe --desktop-recovery-backup $backup --data-dir $dataDir
          if ($LASTEXITCODE -ne 0) { throw 'Recovery helper create failed.' }
          & dist/infomancer-core.exe --desktop-recovery-verify $backup
          if ($LASTEXITCODE -ne 0) { throw 'Recovery helper verify failed.' }

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Generate native icons
        working-directory: desktop
        run: npm run tauri -- icon app-icon.svg

      - name: Check Rust shell
        working-directory: desktop/src-tauri
        run: cargo check --locked

      - name: Build NSIS installer
        working-directory: desktop
        run: npm run build

      - name: Smoke-test zero-residue silent uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path desktop/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }
          $installDir = Join-Path $env:LOCALAPPDATA 'InfoMancer'
          $dataDir = Join-Path $env:APPDATA 'InfoMancer'
          $localData = Join-Path $env:LOCALAPPDATA 'InfoMancer'
          $legacyLocal = Join-Path $env:LOCALAPPDATA 'InfoMancerDesktop'
          $legacyRoaming = Join-Path $env:APPDATA 'InfoMancerDesktop'
          $tempData = Join-Path $env:TEMP 'InfoMancer'
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          New-Item -ItemType Directory -Force $dataDir, $legacyLocal, $legacyRoaming, $tempData | Out-Null
          Set-Content -Path (Join-Path $dataDir 'ci-residue.txt') -Value 'delete me'
          Set-Content -Path (Join-Path $legacyLocal 'ci-residue.txt') -Value 'delete me'
          Set-Content -Path (Join-Path $legacyRoaming 'ci-residue.txt') -Value 'delete me'
          Set-Content -Path (Join-Path $tempData 'ci-residue.txt') -Value 'delete me'
          $uninstaller = Get-ChildItem -Path $installDir -Filter 'uninstall.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninstaller) { throw 'Installed uninstaller was not found.' }
          Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 3
          foreach ($path in @($dataDir, $legacyLocal, $legacyRoaming, $tempData)) {
            if (Test-Path $path) { throw "InfoMancer residue remained after uninstall: $path" }
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: infomancer-windows-testing
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
