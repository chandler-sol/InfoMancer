name: Windows Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - testing/0.8-alpha
      - testing/0.9-alpha-reseed
    paths:
      - desktop/**
      - app/**
      - scripts/build_minimal_ffprobe.sh
      - scripts/stage_ffprobe.py
      - requirements.txt
      - .github/workflows/windows-desktop.yml
  pull_request:
    branches:
      - testing/0.9-alpha-reseed
    paths:
      - desktop/**
      - app/**
      - scripts/build_minimal_ffprobe.sh
      - scripts/stage_ffprobe.py
      - requirements.txt
      - .github/workflows/windows-desktop.yml

permissions:
  contents: read

jobs:
  build-minimal-windows-ffprobe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install MinGW cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-mingw-w64-x86-64

      - name: Build minimal FFprobe from pinned FFmpeg source
        run: bash scripts/build_minimal_ffprobe.sh build/minimal-ffprobe

      - name: Upload minimal FFprobe bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: minimal-ffprobe-win64
          path: build/minimal-ffprobe/
          if-no-files-found: error
          retention-days: 7

  build-windows:
    needs: build-minimal-windows-ffprobe
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Download minimal FFprobe bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: minimal-ffprobe-win64
          path: build/minimal-ffprobe

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.21.0

      - name: Run application tests
        run: python -m unittest discover -s tests -v

      - name: Verify and stage minimal FFprobe
        run: python scripts/stage_ffprobe.py --input build/minimal-ffprobe --output build/ffprobe

      - name: Build bundled InfoMancer core
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --name infomancer-core --add-data "app/templates;app/templates" --add-data "app/static;app/static" --add-data "build/ffprobe/FFPROBE_LICENSE.txt;third-party/ffprobe" --add-data "build/ffprobe/FFPROBE_NOTICE.txt;third-party/ffprobe" --add-data "build/ffprobe/FFPROBE_BUILDINFO.txt;third-party/ffprobe" --add-data "build/ffprobe/FFPROBE_BUILD_SCRIPT.sh;third-party/ffprobe" --add-data "build/ffprobe/FFPROBE_CONFIGURE_ARGS.txt;third-party/ffprobe" --add-data "build/ffprobe/FFPROBE_DLL_DEPENDENCIES.txt;third-party/ffprobe" --add-data "build/ffprobe/FFPROBE_SOURCE_COMMIT.txt;third-party/ffprobe" --add-data "build/ffprobe/FFPROBE_BUILD_MARKER.txt;third-party/ffprobe" --add-binary "build/ffprobe/ffprobe.exe;." desktop/sidecar.py
          $selfCheck = Start-Process -FilePath '.\dist\infomancer-core.exe' -ArgumentList '--check-ffprobe' -Wait -PassThru
          if ($selfCheck.ExitCode -ne 0) { throw "Bundled FFprobe self-check failed: $($selfCheck.ExitCode)" }
          $triple = (rustc --print host-tuple).Trim()
          New-Item -ItemType Directory -Force desktop/src-tauri/binaries | Out-Null
          Copy-Item dist/infomancer-core.exe "desktop/src-tauri/binaries/infomancer-core-$triple.exe"

          $ffprobeResources = 'desktop/src-tauri/resources/ffprobe'
          Remove-Item $ffprobeResources -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $ffprobeResources | Out-Null
          Copy-Item build/ffprobe/FFPROBE_LICENSE.txt $ffprobeResources
          Copy-Item build/ffprobe/FFPROBE_NOTICE.txt $ffprobeResources
          Copy-Item build/ffprobe/FFPROBE_BUILDINFO.txt $ffprobeResources
          Copy-Item build/ffprobe/FFPROBE_BUILD_SCRIPT.sh $ffprobeResources
          Copy-Item build/ffprobe/FFPROBE_CONFIGURE_ARGS.txt $ffprobeResources
          Copy-Item build/ffprobe/FFPROBE_DLL_DEPENDENCIES.txt $ffprobeResources
          Copy-Item build/ffprobe/FFPROBE_SOURCE_COMMIT.txt $ffprobeResources
          Copy-Item build/ffprobe/FFPROBE_BUILD_MARKER.txt $ffprobeResources

      - name: Smoke-test recovery helper
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'infomancer-recovery-smoke'
          $backup = Join-Path $env:RUNNER_TEMP 'InfoMancer-Recovery-Smoke.infomancer-backup'
          New-Item -ItemType Directory -Force $data | Out-Null
          $env:SMOKE_DB = Join-Path $data 'infomancer.db'
          python -c "import os; from pathlib import Path; from app.db import Database; Database(Path(os.environ['SMOKE_DB'])).initialize()"
          $recovery = Start-Process -FilePath '.\dist\infomancer-core.exe' -ArgumentList @('--data-dir', $data, '--recovery-output', $backup) -Wait -PassThru
          if ($recovery.ExitCode -ne 0 -or -not (Test-Path $backup)) { throw "Recovery helper smoke test failed: $($recovery.ExitCode)" }

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Audit desktop dependencies
        working-directory: desktop
        run: npm audit --audit-level=high

      - name: Generate native icons
        working-directory: desktop
        run: npm run icon

      - name: Check Rust shell
        working-directory: desktop
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Build NSIS installer
        working-directory: desktop
        run: npm run build

      - name: Verify Windows launcher uses GUI subsystem
        shell: pwsh
        run: |
          $env:INFOMANCER_PE = (Resolve-Path 'desktop/src-tauri/target/release/infomancer-desktop.exe').Path
          python -c "import os,struct; data=open(os.environ['INFOMANCER_PE'],'rb').read(); pe=struct.unpack_from('<I',data,0x3c)[0]; subsystem=struct.unpack_from('<H',data,pe+24+68)[0]; print(f'Windows PE subsystem={subsystem}'); assert subsystem == 2, 'InfoMancer launcher was built as a console application'"

      - name: Smoke-test installed launch and zero-residue silent uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'desktop/src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent install failed: $($process.ExitCode)" }

          $installDir = Join-Path $env:LOCALAPPDATA 'InfoMancer'
          $launcher = Get-ChildItem $installDir -Filter '*.exe' |
            Where-Object { $_.Name -ne 'uninstall.exe' -and $_.Name -ne 'infomancer-core.exe' } |
            Select-Object -First 1
          if (-not $launcher) { throw "Installed InfoMancer launcher was not found under $installDir" }

          $ffprobeNotice = Join-Path $installDir 'third-party\ffprobe\FFPROBE_NOTICE.txt'
          $ffprobeLicense = Join-Path $installDir 'third-party\ffprobe\FFPROBE_LICENSE.txt'
          $ffprobeBuildInfo = Join-Path $installDir 'third-party\ffprobe\FFPROBE_BUILDINFO.txt'
          foreach ($path in @($ffprobeNotice, $ffprobeLicense, $ffprobeBuildInfo)) {
            if (-not (Test-Path $path)) { throw "Installed FFprobe compliance resource is missing: $path" }
          }
          if (-not (Select-String -Path $ffprobeNotice -SimpleMatch 'Independent JPEG Group' -Quiet)) {
            throw 'Installed FFprobe notice is missing the IJG attribution.'
          }
          if (-not (Select-String -Path $ffprobeBuildInfo -SimpleMatch 'infomancer-ad500d59cb' -Quiet)) {
            throw 'Installed FFprobe build provenance is missing the exact-source build marker.'
          }

          $log = Join-Path $env:APPDATA 'cloud.arsenik.infomancer\logs\desktop-launcher.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $launcher.FullName -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            if (Test-Path $log) { Get-Content $log | Write-Host }
            throw "Installed InfoMancer exited during startup with code $($process.ExitCode)."
          }
          if (-not (Test-Path $log)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "InfoMancer stayed alive but did not create its launcher diagnostic log at $log."
          }
          $logText = Get-Content $log -Raw
          $logText | Write-Host
          if (-not $logText.Contains('Tauri application built successfully; entering the desktop event loop.')) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'InfoMancer process stayed alive but never completed Tauri desktop startup.'
          }
          Stop-Process -Id $process.Id -Force
          Start-Sleep -Seconds 1

          $uninstaller = Join-Path $installDir 'uninstall.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Installed uninstaller was not found.' }
          $owned = @(
            (Join-Path $env:APPDATA 'cloud.arsenik.infomancer'),
            (Join-Path $env:LOCALAPPDATA 'cloud.arsenik.infomancer'),
            (Join-Path $env:APPDATA 'cloud.arsenik.infomancer.desktop.poc'),
            (Join-Path $env:LOCALAPPDATA 'cloud.arsenik.infomancer.desktop.poc'),
            (Join-Path $env:TEMP 'InfoMancer')
          )
          foreach ($path in $owned) { New-Item -ItemType Directory -Force $path | Out-Null; Set-Content (Join-Path $path 'residue-marker.txt') 'owned by InfoMancer' }
          $process = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent uninstall failed: $($process.ExitCode)" }
          Start-Sleep -Seconds 2
          foreach ($path in $owned) { if (Test-Path $path) { throw "Uninstall residue remains: $path" } }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\InfoMancer') { throw 'Uninstall registry entry remains.' }
          if (Test-Path 'HKCU:\Software\Arsenik\InfoMancer') { throw 'InfoMancer publisher registry state remains.' }

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: InfoMancer-Windows-${{ github.sha }}
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          compression-level: 0
