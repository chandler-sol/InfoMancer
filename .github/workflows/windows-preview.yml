name: Fast Windows Preview

on:
  workflow_dispatch:
  pull_request:
    branches:
      - testing/0.8-alpha
    paths:
      - .github/workflows/windows-preview.yml
      - desktop/**
      - app/**
      - scripts/stage_ffprobe.py
      - requirements.txt

permissions:
  contents: write

env:
  PREVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: windows-preview-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows-preview:
    name: Windows preview installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out preview commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PREVIEW_SHA }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node with npm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Restore Rust build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: windows-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-cargo-

      - name: Restore verified FFprobe stage
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/ffprobe
          key: windows-ffprobe-${{ hashFiles('scripts/stage_ffprobe.py') }}
          restore-keys: |
            windows-ffprobe-

      - name: Install Python build dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.21.0

      - name: Build bundled InfoMancer core
        shell: pwsh
        run: |
          python scripts/stage_ffprobe.py
          python -m PyInstaller --noconfirm --onefile --noconsole --name infomancer-core --add-data "app/templates;app/templates" --add-data "app/static;app/static" --add-data "build/ffprobe/FFPROBE_LICENSE.txt;third-party/ffprobe" --add-data "build/ffprobe/FFPROBE_NOTICE.txt;third-party/ffprobe" --add-binary "build/ffprobe/ffprobe.exe;." desktop/sidecar.py
          & .\dist\infomancer-core.exe --check-ffprobe
          if ($LASTEXITCODE -ne 0) { throw "Bundled FFprobe self-check failed: $LASTEXITCODE" }
          $triple = (rustc --print host-tuple).Trim()
          New-Item -ItemType Directory -Force desktop/src-tauri/binaries | Out-Null
          Copy-Item dist/infomancer-core.exe "desktop/src-tauri/binaries/infomancer-core-$triple.exe"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --prefer-offline --no-audit

      - name: Generate native icons
        working-directory: desktop
        run: npm run icon

      - name: Stamp installer build identity
        working-directory: desktop
        shell: pwsh
        run: |
          if (-not $env:PREVIEW_SHA) { throw 'PREVIEW_SHA is required to stamp the installer.' }
          $shortSha = $env:PREVIEW_SHA.Substring(0, [Math]::Min(8, $env:PREVIEW_SHA.Length))
          $hooksPath = 'src-tauri/windows/hooks.nsh'
          $hooks = Get-Content $hooksPath -Raw
          $hooks = $hooks.Replace('!define INFOMANCER_BUILD_COMMIT "local"', "!define INFOMANCER_BUILD_COMMIT `"$shortSha`"")
          $hooks = $hooks.Replace('!define INFOMANCER_BUILD_COMMIT_FULL "local"', "!define INFOMANCER_BUILD_COMMIT_FULL `"$env:PREVIEW_SHA`"")
          Set-Content -Path $hooksPath -Value $hooks -Encoding utf8
          "PREVIEW_SHORT_SHA=$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Installer identity: build $shortSha ($env:PREVIEW_SHA)"

      - name: Build Windows installer
        working-directory: desktop
        run: npm run tauri -- build --bundles nsis

      - name: Verify Windows launcher uses GUI subsystem
        shell: pwsh
        run: |
          $env:INFOMANCER_PE = (Resolve-Path 'desktop/src-tauri/target/release/infomancer-desktop.exe').Path
          python -c "import os,struct; data=open(os.environ['INFOMANCER_PE'],'rb').read(); pe=struct.unpack_from('<I',data,0x3c)[0]; subsystem=struct.unpack_from('<H',data,pe+24+68)[0]; print(f'Windows PE subsystem={subsystem}'); assert subsystem == 2, 'InfoMancer launcher was built as a console application'"

      - name: Stage preview installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installer = Get-ChildItem 'desktop/src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }
          if (-not $env:PREVIEW_SHORT_SHA) { throw 'PREVIEW_SHORT_SHA was not produced.' }
          $baseName = [System.IO.Path]::GetFileNameWithoutExtension($installer.Name) -replace '-setup$', ''
          $previewName = "$baseName-commit-$($env:PREVIEW_SHORT_SHA)-setup.exe"
          Copy-Item $installer.FullName (Join-Path 'release-assets' $previewName)
          "PREVIEW_INSTALLER=$previewName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Staged $previewName"

      - name: Upload Windows preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infomancer-windows-preview
          path: release-assets/*-setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Refresh owner draft with latest Windows preview
        if: ${{ github.actor == github.repository_owner && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('app/main.py').read_text(encoding='utf-8')
          print(re.search(r'^APP_VERSION\s*=\s*"([^"]+)"', text, re.MULTILINE).group(1))
          PY
          )"
          TAG="v$VERSION"
          TITLE="InfoMancer $VERSION"
          NOTES="docs/releases/$VERSION.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
            if [ "$IS_DRAFT" != "true" ]; then
              echo "Release $TAG is already published; keeping the preview as an Actions artifact only."
              exit 0
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
                -f sha="$PREVIEW_SHA" -F force=true >/dev/null
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$TAG" -f sha="$PREVIEW_SHA" >/dev/null
            fi
            if [ -f "$NOTES" ]; then
              gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES" --draft --prerelease
            fi
          else
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" --target "$PREVIEW_SHA" --title "$TITLE" --notes-file "$NOTES" --draft --prerelease
            else
              gh release create "$TAG" --target "$PREVIEW_SHA" --title "$TITLE" --notes "Windows development preview." --draft --prerelease
            fi
          fi

          while IFS= read -r asset; do
            case "$asset" in
              *-commit-????????-setup.exe)
                if [ "$asset" != "$PREVIEW_INSTALLER" ]; then
                  gh release delete-asset "$TAG" "$asset" -y || true
                fi
                ;;
            esac
          done < <(gh release view "$TAG" --json assets --jq '.assets[].name')

          gh release upload "$TAG" "release-assets/$PREVIEW_INSTALLER" --clobber
          echo "Latest Windows preview uploaded to draft $TAG from $PREVIEW_SHA as $PREVIEW_INSTALLER."
