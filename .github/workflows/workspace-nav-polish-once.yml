name: Apply Workspace navigation polish once

on:
  push:
    branches:
      - workspace/0.8-foundation
    paths:
      - .github/workflows/workspace-nav-polish-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out workspace branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: workspace/0.8-foundation
          fetch-depth: 0
          persist-credentials: false

      - name: Install application dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Apply navigation polish
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise RuntimeError(f"Expected {label} block was not found")
              return text.replace(old, new, 1)

          base_path = Path("app/templates/base.html")
          base = base_path.read_text(encoding="utf-8")
          base = replace_once(
              base,
              '<summary aria-label="Library shortcuts">Library</summary>',
              '<summary aria-label="Browse shortcuts">Browse</summary>',
              "Library section label",
          )
          base = replace_once(
              base,
              '<a href="/libraries" title="Libraries"{% if request.url.path.startswith(\'/libraries\') %} class="active" aria-current="page"{% endif %}><svg',
              '<a href="/libraries" title="Custom Libraries"{% if request.url.path.startswith(\'/libraries\') %} class="active" aria-current="page"{% endif %}><svg',
              "custom libraries title",
          )
          base = replace_once(base, '<span>Libraries</span></a>', '<span>Custom Libraries</span></a>', "custom libraries label")
          base_path.write_text(base, encoding="utf-8")

          css_path = Path("app/static/workspace.css")
          css = css_path.read_text(encoding="utf-8")
          css = replace_once(css, '  content: "›";\n', '  content: "‹";\n', "closed disclosure chevron")
          css = replace_once(
              css,
              '  transform: translateY(-52%) rotate(90deg);\n',
              '  transform: translateY(-52%) rotate(-90deg);\n',
              "open disclosure chevron",
          )
          css = replace_once(
              css,
              '  padding: 2px 5px;\n  border: 1px solid rgba(81, 214, 230, .34);',
              '  padding: 3px 7px;\n  border: 1px solid rgba(81, 214, 230, .34);',
              "alpha badge padding",
          )
          css = replace_once(css, '  font-size: 7px;\n  font-weight: 900;', '  font-size: 10.5px;\n  font-weight: 900;', "alpha badge size")
          css = replace_once(
              css,
              '    padding: 1px 3px;\n    font-size: 6px;',
              '    padding: 2px 4px;\n    font-size: 8px;',
              "collapsed alpha badge size",
          )
          css_path.write_text(css, encoding="utf-8")

          test_path = Path("tests/test_workspace_ui.py")
          tests = test_path.read_text(encoding="utf-8")
          needle = '        self.assertIn("0.8 α", base)\n'
          replacement = needle + '        self.assertIn(\'<summary aria-label="Browse shortcuts">Browse</summary>\', base)\n        self.assertIn("<span>Custom Libraries</span>", base)\n        self.assertIn(\'content: "‹"\', styles)\n        self.assertIn("font-size: 10.5px", styles)\n'
          tests = replace_once(tests, needle, replacement, "Workspace navigation assertions")
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Run test suite
        run: python3 -m unittest discover -s tests -v

      - name: Compile application
        run: python3 -m compileall app

      - name: Commit clean navigation polish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f .github/workflows/workspace-nav-polish-once.yml
          git config user.name "arsenik"
          git config user.email "64607629+chandler-sol@users.noreply.github.com"
          git add -A
          git commit -m "Polish Workspace navigation hierarchy"
          BASIC="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $BASIC" push origin HEAD:workspace/0.8-foundation
