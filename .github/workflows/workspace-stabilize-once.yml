name: Apply Workspace stabilization once

on:
  push:
    branches:
      - workspace/0.8-foundation
    paths:
      - scripts/apply_workspace_stabilization.py
      - .github/workflows/workspace-stabilize-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out workspace branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: workspace/0.8-foundation
          fetch-depth: 0
          persist-credentials: false

      - name: Install application dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Apply W1 stabilization patch
        run: python3 scripts/apply_workspace_stabilization.py

      - name: Run test suite
        run: python3 -m unittest discover -s tests -v

      - name: Compile application
        run: python3 -m compileall app

      - name: Commit clean stabilization tree
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f scripts/apply_workspace_stabilization.py .github/workflows/workspace-stabilize-once.yml
          git config user.name "arsenik"
          git config user.email "64607629+chandler-sol@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Stabilize 0.8 workspace shell"
          BASIC="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $BASIC" push origin HEAD:workspace/0.8-foundation
