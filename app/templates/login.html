{% extends "base.html" %}
{% block title %}Sign in · InfoMancer{% endblock %}
{% block content %}
<section class="auth-layout login-layout">
  <div class="auth-intro"><p class="eyebrow">WELCOME BACK</p><h1>Sign in to InfoMancer</h1><p>Your library stays private until your account is verified.</p></div>
  <form class="auth-card auth-form" method="post" action="/login">
    <input type="hidden" name="preauth_token" value="{{ preauth_token }}"><input type="hidden" name="next" value="{{ next }}">
    {% if error %}<div class="form-error">{{ error }}</div>{% endif %}
    <label>Username or email<input name="identity" value="{{ identity }}" autocomplete="username" autofocus required></label>
    <label>Password<span class="password-control"><input id="login-password" name="password" type="password" autocomplete="current-password" required><button type="button" class="password-visibility-toggle" data-password-toggle="login-password" aria-pressed="false" aria-label="Show password">Show</button></span></label>
    <button class="button primary auth-submit">Sign in</button>
  </form>
</section>
{% endblock %}
