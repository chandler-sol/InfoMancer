services:
  infomancer:
    build:
      context: .
      args:
        INFOMANCER_UID: ${INFOMANCER_UID:-1000}
        INFOMANCER_GID: ${INFOMANCER_GID:-1000}
    container_name: infomancer-sandbox
    restart: unless-stopped
    env_file: .env.sandbox
    ports:
      - "127.0.0.1:8788:8787"
    volumes:
      - ./data-sandbox:/app/data
      - ./sandbox-media:/media
