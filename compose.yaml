services:
  infomancer:
    build:
      context: .
      args:
        INFOMANCER_UID: ${INFOMANCER_UID:-1000}
        INFOMANCER_GID: ${INFOMANCER_GID:-1000}
    container_name: infomancer
    restart: unless-stopped
    env_file: .env
    # InfoMancer runs as an unprivileged image user and does not require Linux
    # capabilities. Keep privilege escalation unavailable even if a dependency is
    # compromised inside the container.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      # Keep this loopback-only; Cloudflare Tunnel is the public entry point.
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/app/data
      # Host media mappings belong in compose.media.yaml. Platform-specific
      # examples are provided in deploy/. The container always sees them below
      # /media, regardless of the host operating system.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
